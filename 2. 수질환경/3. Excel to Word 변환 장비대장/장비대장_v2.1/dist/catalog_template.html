<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수질환경팀 시험장비 관리대장</title>
<style>/* 카탈로그 스타일 — awesome-design-md 'airbnb' DESIGN.md 규칙을 참고
 * (흰 바탕 + 잉크색 글자 + 강조색 1개, 알약형 검색바, 사진 위주 카드, 그림자 1단계, 둥근 모서리)
 * 색·간격·모서리는 모두 :root 변수로만 쓴다. 로고·상표·고유 문구는 사용하지 않음. */
:root{
  --primary:#ff385c; --primary-active:#e00b41; --primary-disabled:#ffd1da; --error:#c13515;
  --ink:#222222; --body:#3f3f3f; --muted:#6a6a6a; --muted-soft:#929292;
  --hairline:#dddddd; --hairline-soft:#ebebeb; --border-strong:#c1c1c1;
  --canvas:#ffffff; --surface-soft:#f7f7f7; --surface-strong:#f2f2f2; --mark:#fff0a8;
  --r-xs:4px; --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:32px; --r-full:9999px;
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-base:16px; --s-lg:24px; --s-xl:32px; --s-xxl:48px;
  --shadow:rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",-apple-system,system-ui,Roboto,"Helvetica Neue",sans-serif;
  --maxw:1440px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.43 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--s-xl)}
@media (max-width:743px){.wrap{padding:0 var(--s-base)}}

/* ---------- 상단바 ---------- */
.topnav{position:sticky;top:0;z-index:30;background:var(--canvas);border-bottom:1px solid var(--hairline-soft)}
.topnav .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:80px;gap:var(--s-base)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--primary);letter-spacing:-.2px;white-space:nowrap}
.brand svg{flex:none}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:12px;letter-spacing:0}
.tabs{display:flex;gap:var(--s-xl)}
.tab{border:0;background:none;padding:10px 2px;font-weight:600;font-size:16px;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-weight:500;color:var(--muted);font-size:13px;margin-left:4px}
.navright{display:flex;justify-content:flex-end;gap:var(--s-sm);align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--ink);background:var(--canvas);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;height:48px;padding:0 24px;font-size:16px}
.btn.primary:hover{background:var(--primary-active);border-color:var(--primary-active)}
.btn.primary:disabled{background:var(--primary-disabled);border-color:var(--primary-disabled);cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-strong)}
.btn.pill{border-radius:var(--r-full);border-color:var(--hairline)}
.btn.block{width:100%}
.iconbtn{width:40px;height:40px;border-radius:var(--r-full);border:1px solid var(--hairline);background:var(--canvas);display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{box-shadow:var(--shadow)}
.badge-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-full);background:var(--primary);color:#fff;font-size:11px;font-weight:600}
@media (max-width:1127px){.topnav .bar{grid-template-columns:auto 1fr auto}.tabs{justify-content:center;gap:var(--s-lg)}.brand small{display:none}}
@media (max-width:743px){.topnav .bar{grid-template-columns:1fr auto;height:auto;padding-top:12px;padding-bottom:12px}.tabs{grid-column:1/-1;order:3;justify-content:flex-start}.brand span.t{font-size:16px}}

/* ---------- 알약형 검색바 ---------- */
.searchzone{padding-top:var(--s-base);padding-bottom:var(--s-sm)}
.search{display:flex;align-items:center;max-width:920px;margin:0 auto;height:66px;border:1px solid var(--hairline);border-radius:var(--r-full);box-shadow:var(--shadow);background:var(--canvas)}
.seg{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:8px 24px;height:100%;border-radius:var(--r-full);position:relative}
.seg+.seg::before{content:"";position:absolute;left:0;top:18px;bottom:18px;border-left:1px solid var(--hairline)}
.seg:focus-within{background:var(--canvas);box-shadow:var(--shadow)}
.seg:hover:not(:focus-within){background:var(--surface-strong)}
.seg label{font-size:12px;font-weight:700;color:var(--ink)}
.seg input{border:0;outline:0;background:transparent;padding:2px 0 0;font-size:14px;color:var(--ink);width:100%}
.seg input::placeholder{color:var(--muted)}
.orb{flex:none;width:48px;height:48px;margin-right:9px;border:0;border-radius:var(--r-full);background:var(--primary);color:#fff;display:grid;place-items:center}
.orb:hover{background:var(--primary-active)}
@media (max-width:743px){.search{flex-wrap:wrap;height:auto;border-radius:var(--r-lg);padding:6px}.seg{flex:1 1 45%;padding:8px 14px}.seg+.seg::before{display:none}.seg.wide{flex-basis:100%}.orb{margin:4px auto 4px}}

/* ---------- 금액 구간 띠 ---------- */
.strip{display:flex;align-items:center;gap:var(--s-md);padding-top:var(--s-base);padding-bottom:var(--s-base);border-bottom:1px solid var(--hairline-soft)}
.chips{display:flex;gap:var(--s-sm);overflow-x:auto;scrollbar-width:thin;padding:2px;flex:1}
.chip{flex:none;height:40px;padding:0 16px;border-radius:var(--r-full);border:1px solid var(--hairline);background:var(--canvas);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .c{font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"] .c{color:#ddd}
.chip.sm{height:32px;padding:0 12px;font-size:13px}
.filterbtn{flex:none;height:48px;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--canvas);padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.filterbtn:hover{border-color:var(--ink)}

/* ---------- 결과 머리 ---------- */
.reshead{display:flex;align-items:center;gap:var(--s-md);flex-wrap:wrap;padding:var(--s-lg) 0 var(--s-base)}
.reshead h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.44px}
.reshead .sum{color:var(--muted)}
.reshead .sp{flex:1}
.active-filters{display:flex;gap:6px;flex-wrap:wrap}
.af{height:28px;padding:0 10px;border-radius:var(--r-full);background:var(--surface-strong);border:0;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.af:hover{background:var(--hairline)}
select.sel{height:40px;border:1px solid var(--hairline);border-radius:var(--r-sm);padding:0 12px;background:var(--canvas)}
.seg2{display:inline-flex;border:1px solid var(--hairline);border-radius:var(--r-sm);overflow:hidden}
.seg2 button{border:0;background:var(--canvas);height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- 카드 격자 ---------- */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-xl) var(--s-lg);padding-bottom:var(--s-xxl)}
@media (min-width:1600px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:1127px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{cursor:pointer;border-radius:var(--r-md);outline-offset:4px}
.ph{position:relative;aspect-ratio:1/1;border-radius:var(--r-md);overflow:hidden;background:var(--surface-strong)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card:hover .ph img{transform:scale(1.03)}
.noimg{width:100%;height:100%;display:grid;place-items:center;color:var(--muted-soft);font-size:13px;text-align:center}
.noimg svg{display:block;margin:0 auto 6px}
.fbadge{position:absolute;top:12px;left:12px;background:var(--canvas);border-radius:var(--r-full);padding:4px 10px;font-size:11px;font-weight:600;box-shadow:var(--shadow)}
.heart{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;background:none;display:grid;place-items:center;padding:0}
.heart svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.heart path{fill:rgba(0,0,0,.5);stroke:#fff;stroke-width:2}
.heart[aria-pressed="true"] path{fill:var(--primary)}
.dhead .heart path{fill:none;stroke:var(--ink)}
.dhead .heart[aria-pressed="true"] path{fill:var(--primary);stroke:var(--primary)}
.meta{padding-top:var(--s-md)}
.m1{display:flex;justify-content:space-between;gap:8px}
.mid{font-size:13px;font-weight:600;color:var(--ink)}
.myear{font-size:13px;color:var(--muted);white-space:nowrap}
.mname{font-size:16px;font-weight:600;line-height:1.3;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mspec{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mprice{margin-top:6px;font-size:15px}
.mprice b{font-weight:600}
.empty{padding:80px 0;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:20px;color:var(--ink);font-weight:600;margin-bottom:8px}

/* ---------- 표 보기 ---------- */
.tablewrap{border:1px solid var(--hairline);border-radius:var(--r-md);overflow:auto;margin-bottom:var(--s-xxl);max-height:calc(100vh - 260px)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--hairline-soft);text-align:left;vertical-align:top}
table.t th{position:sticky;top:0;background:var(--surface-soft);font-weight:600;white-space:nowrap;z-index:1;cursor:pointer;user-select:none}
table.t th[data-sort]:hover{background:var(--surface-strong)}
table.t td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:var(--surface-soft)}
.thumb{width:52px;height:52px;border-radius:var(--r-sm);object-fit:cover;display:block;background:var(--surface-strong)}

/* ---------- 모달 공통 ---------- */
.scrim{--pad:40px;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;overflow:auto;padding:var(--pad) 16px}
.scrim.show{display:block}
.dialog{background:var(--canvas);border-radius:var(--r-lg);max-width:1120px;margin:0 auto;box-shadow:var(--shadow);position:relative}
.dialog.narrow{max-width:780px}
.dhead{display:flex;align-items:center;gap:8px;padding:16px 24px;border-bottom:1px solid var(--hairline-soft);position:sticky;top:calc(-1 * var(--pad));background:var(--canvas);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:2}
.dhead h3{flex:1;margin:0;font-size:16px;font-weight:700;text-align:center}
.dfoot{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--hairline-soft);position:sticky;bottom:calc(-1 * var(--pad));background:var(--canvas);border-radius:0 0 var(--r-lg) var(--r-lg)}
.dbody{padding:24px}
@media (max-width:743px){.scrim{--pad:0px;padding:0}.dialog{border-radius:0;min-height:100vh}.dhead{border-radius:0}}

/* ---------- 상세(리스팅) ---------- */
.dt-title{font-size:26px;font-weight:600;letter-spacing:-.44px;line-height:1.25;margin:0 0 6px}
.dt-sub{color:var(--ink);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.dt-sub .dot::before{content:"·";margin-right:14px;color:var(--muted)}
.gallery{margin:20px 0 0;border-radius:var(--r-md);overflow:hidden;background:var(--surface-soft);aspect-ratio:16/9;max-height:520px;width:100%;display:grid;place-items:center;cursor:zoom-in}
.gallery img{width:100%;height:100%;object-fit:contain;background:var(--surface-soft)}
.dt-cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:56px;margin-top:28px}
@media (max-width:1000px){.dt-cols{grid-template-columns:1fr;gap:24px}}
.sec{padding:28px 0;border-top:1px solid var(--hairline)}
.sec:first-child{border-top:0;padding-top:0}
.sec h4{margin:0 0 16px;font-size:21px;font-weight:700;letter-spacing:0}
.sec h4 .cnt{font-size:15px;color:var(--muted);font-weight:500;margin-left:6px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 32px}
@media (max-width:560px){.facts{grid-template-columns:1fr}}
.fact{display:flex;gap:14px;padding:10px 0;align-items:flex-start}
.fact svg{flex:none;margin-top:2px}
.fact .k{font-size:13px;color:var(--muted)}
.fact .v{font-size:16px;word-break:break-word;white-space:pre-wrap}
.note{white-space:pre-wrap;font-size:15.5px;line-height:1.6;color:var(--body);background:var(--surface-soft);border-radius:var(--r-md);padding:18px 20px;margin:0}
.note.empty-note,.comp-empty{color:var(--muted)}
table.comp{width:100%;border-collapse:collapse;font-size:15px}
table.comp th{font-size:13px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline)}
table.comp td{padding:12px 10px;border-bottom:1px solid var(--hairline-soft)}
table.comp td.c1{width:56px;color:var(--muted)}
table.comp td.c3,table.comp td.c4{width:70px;text-align:center}
table.comp tr.blank td{color:var(--muted-soft)}
.comp-empty{margin-top:10px;font-size:13.5px}
.rcard{position:sticky;top:90px;border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--shadow);padding:24px}
.rcard .price{font-size:22px;font-weight:700}
.rcard .price small{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border-strong);border-radius:var(--r-sm);margin:16px 0}
.rgrid div{padding:10px 12px}
.rgrid div:nth-child(odd){border-right:1px solid var(--border-strong)}
.rgrid div:nth-child(n+3){border-top:1px solid var(--border-strong)}
.rgrid b{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2px}
.rgrid span{font-size:14px}
.ractions{display:grid;gap:10px}
.rhint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}
.pager{display:flex;gap:8px}
.statusdot{display:inline-flex;align-items:center;gap:6px}
.statusdot::before{content:"";width:8px;height:8px;border-radius:50%;background:#2e9b5b}
.statusdot.off::before{background:var(--muted-soft)}

/* ---------- 필터 모달 ---------- */
.fsec{padding:24px 0;border-bottom:1px solid var(--hairline)}
.fsec:last-child{border-bottom:0}
.fsec h5{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:-.18px}
.fsec p.d{margin:0 0 16px;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:2px;height:72px;margin:8px 10px 0}
.hist i{flex:1;background:var(--hairline);border-radius:2px 2px 0 0;min-height:2px}
.hist i.on{background:var(--primary)}
.range{position:relative;height:28px;margin:0 10px}
.range input{position:absolute;left:0;right:0;top:4px;width:100%;pointer-events:none;-webkit-appearance:none;appearance:none;background:none;margin:0}
.range input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--border-strong);box-shadow:var(--shadow);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--border-strong);box-shadow:var(--shadow);cursor:grab}
.range .track{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--hairline)}
.range .fill{position:absolute;top:13px;height:2px;background:var(--ink)}
.money{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-top:18px}
.mfield{border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:8px 14px}
.mfield:focus-within{border:2px solid var(--ink);padding:7px 13px}
.mfield label{display:block;font-size:12px;color:var(--muted)}
.mfield div{display:flex;align-items:center;gap:4px}
.mfield input{border:0;outline:0;width:100%;font-size:16px;padding:2px 0}
.mfield span{color:var(--muted);white-space:nowrap}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.togglerow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;gap:16px}
.togglerow b{font-weight:400;font-size:16px}
.togglerow small{display:block;color:var(--muted);font-size:13px}
.switch{position:relative;width:48px;height:32px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:var(--r-full);background:var(--hairline);transition:.15s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:.15s}
.switch input:checked+span{background:var(--ink)}
.switch input:checked+span::after{left:18px}
.yr{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.yr select{height:48px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 12px;background:var(--canvas)}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- 엑셀 원본 보기 ---------- */
.sheetbar{display:flex;align-items:center;gap:var(--s-md);flex-wrap:wrap;padding:var(--s-lg) 0 var(--s-base)}
.sheetbar .sp{flex:1}
.sheetbar .chips{flex:1 1 420px;min-width:0}
.sbox{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--hairline);border-radius:var(--r-full);padding:0 16px;min-width:260px;box-shadow:var(--shadow)}
.sbox input{border:0;outline:0;flex:1;background:none}
.xls{border:1px solid var(--hairline);border-radius:var(--r-md);overflow:auto;max-height:calc(100vh - 250px);margin-bottom:var(--s-xxl)}
table.x{border-collapse:separate;border-spacing:0;font-size:13px}
table.x th,table.x td{border-right:1px solid var(--hairline-soft);border-bottom:1px solid var(--hairline-soft);padding:7px 10px;vertical-align:top;max-width:320px}
table.x.nowrap td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.x.wrap td{white-space:pre-wrap;word-break:break-word;min-width:80px}
table.x thead th{position:sticky;top:0;background:var(--surface-soft);font-weight:600;z-index:2;white-space:nowrap}
table.x .rn{position:sticky;left:0;background:var(--surface-soft);color:var(--muted);text-align:right;z-index:1;min-width:44px}
table.x thead .rn{z-index:3}
table.x tr.hit td{background:#fff6f7}
table.x tr.focus td{background:#ffe3e8}
table.x td.link{color:var(--primary);font-weight:600;cursor:pointer;text-decoration:underline}
.sheetmeta{color:var(--muted)}

/* ---------- 보내기 메뉴 ---------- */
.menu{position:absolute;right:0;top:48px;min-width:300px;background:var(--canvas);border-radius:var(--r-md);box-shadow:var(--shadow);border:1px solid var(--hairline-soft);padding:8px 0;display:none;z-index:40}
.menu.show{display:block}
.menu button{display:flex;width:100%;gap:12px;align-items:flex-start;border:0;background:none;text-align:left;padding:12px 18px}
.menu button:hover{background:var(--surface-soft)}
.menu button b{display:block;font-weight:500;font-size:14px}
.menu button small{color:var(--muted);font-size:12.5px}
.menu hr{border:0;border-top:1px solid var(--hairline-soft);margin:6px 0}
.rel{position:relative}

/* ---------- 알림 ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-sm);opacity:0;transition:.2s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{border-top:1px solid var(--hairline-soft);color:var(--muted);font-size:13px;padding-top:24px;padding-bottom:40px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:none;place-items:center;cursor:zoom-out}
.lightbox.show{display:grid}
.lightbox img{max-width:96vw;max-height:94vh}

@media print{
  .topnav,.searchzone,.strip,.reshead,.footer,.dhead,.dfoot,.ractions,.rhint,.pager{display:none!important}
  .scrim{position:static;background:none;padding:0;overflow:visible}
  body.printing main{display:none}
  .dialog{box-shadow:none}
  .rcard{position:static;box-shadow:none}
}

/* ---------- v2.1 편집 기능 ---------- */
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.sech{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sech h4{margin:0;flex:1}
.sech .sp{flex:0}
table.comp.edit td{padding:6px 6px;vertical-align:top}
.in{width:100%;font:inherit;font-size:14px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:8px 10px;background:var(--canvas)}
.in:focus{outline:2px solid var(--ink);outline-offset:-1px}
.in.sm{text-align:center}
textarea.in{resize:vertical;min-height:40px;line-height:1.4}
td.ops{white-space:nowrap;width:1%}
.mini{width:30px;height:30px;border:1px solid var(--hairline);border-radius:var(--r-full);background:var(--canvas);margin-left:2px}
.mini:hover{border-color:var(--ink)}
.mini.del:hover{border-color:var(--error);color:var(--error)}
.edfoot{display:flex;gap:8px;align-items:center;margin-top:12px}
.edfoot .sp{flex:1}
table.comp.htab td.st{text-align:center;width:96px}
.stamp{height:44px;max-width:90px;object-fit:contain;vertical-align:middle}
.noname{font-size:13px;border:1px dashed var(--border-strong);border-radius:var(--r-xs);padding:2px 6px}
.muted{color:var(--muted-soft)}
.nowrap{white-space:nowrap}
.warnbox{background:#fff7e6;border-radius:var(--r-sm);padding:10px 12px;color:#8a5a00}
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);color:#fff}
.editbar .ebin{display:flex;align-items:center;gap:10px;min-height:64px;flex-wrap:wrap}
.editbar .sp{flex:1}
.editbar .btn{border-color:#fff;background:transparent;color:#fff}
.editbar .btn.dark{background:var(--primary);border-color:var(--primary)}
.editbar .btn.ghost{border-color:transparent;text-decoration:underline}
body.has-edits .footer{padding-bottom:110px}
body.has-edits .toast{bottom:90px}
/* 직인 관리 */
.plist{display:grid;gap:10px}
.pcard{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px}
.pst{width:96px;height:64px;border-radius:var(--r-sm);background:repeating-conic-gradient(#f4f4f4 0 25%,#fff 0 50%) 0/12px 12px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.pst img{max-width:90px;max-height:58px;object-fit:contain}
.pinfo b{font-size:16px;margin-right:6px}
.pinfo small{display:block;color:var(--muted)}
.pill-cur{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--primary);border-radius:var(--r-full);padding:1px 8px;vertical-align:2px}
.pops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pform select,.pform input{border:0;outline:0;width:100%;font-size:15px;background:none}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row2 .sp{flex:1}
.ck{display:flex;gap:6px;align-items:center}
.pprev img{height:44px;vertical-align:middle}
.sigpad{margin-top:16px;border-top:1px solid var(--hairline);padding-top:16px}
.sigpad canvas{width:100%;max-width:520px;aspect-ratio:13/5;border:1px dashed var(--border-strong);border-radius:var(--r-sm);touch-action:none;background:#fff;display:block}
@media (max-width:743px){.pcard{grid-template-columns:72px 1fr}.pops{grid-column:1/-1;justify-content:flex-start}.pform{grid-template-columns:1fr}}
@media print{.editbar{display:none!important}}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap}
@media (max-width:743px){
  .topnav .bar{grid-template-columns:1fr}
  .navright{justify-content:flex-start;flex-wrap:wrap;gap:4px}
  .navright .btn{height:36px;padding:0 10px;font-size:13px}
  .tabs{gap:var(--s-base)}
  .menu{left:0;right:auto;min-width:280px}
}
</style>
</head>
<body>
<!-- ========== 상단바 ========== -->
<header class="topnav">
  <div class="wrap bar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="9" width="24" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11 9V6.5A2.5 2.5 0 0 1 13.5 4h5A2.5 2.5 0 0 1 21 6.5V9" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="17.5" r="3.5" fill="currentColor"/></svg>
      <div><span class="t">수질환경팀 시험장비 관리대장</span><small id="meta"></small></div>
    </div>
    <nav class="tabs" role="tablist">
      <span id="catTabs" style="display:contents"></span>
      <button class="tab" role="tab" id="tabSheet" aria-selected="false">엑셀 원본<span class="n" id="nSheets"></span></button>
    </nav>
    <div class="navright">
      <button class="btn ghost" id="btnFav" title="관심 장비만 보기" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 32 32"><path d="M16 28c7-4.7 14-10 14-17a6.8 6.8 0 0 0-14-3 6.8 6.8 0 0 0-14 3c0 7 7 12.3 14 17z" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        관심 <span class="badge-n" id="favN">0</span></button>
      <button class="btn ghost" id="btnPeople" title="담당자·팀장 직인 등록·교체">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="5"/><path d="M8 14l-2 7h12l-2-7"/></svg>직인 관리</button>
      <div class="rel">
        <button class="btn pill" id="btnSend" aria-haspopup="true" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>보내기</button>
        <div class="menu" id="sendMenu" role="menu">
          <button data-act="integrated"><span>💾</span><span><b>통합 엑셀 내보내기 (편집 포함)</b><small>장비구성·수리이력·직인관리 시트를 고친 통합 파일 — 다음 생성 때 이 파일을 쓰세요</small></span></button>
          <button data-act="savehtml"><span>📘</span><span><b>관리대장 파일 저장 (편집 포함)</b><small>지금 내용을 담은 새 관리대장(HTML) 파일 — 다른 사람에게 보낼 때</small></span></button>
          <hr>
          <button data-act="share"><span>📤</span><span><b>원본 엑셀 공유하기</b><small>메일·메신저 등 컴퓨터의 공유 기능으로 보내기(지원하는 브라우저)</small></span></button>
          <button data-act="mail"><span>✉️</span><span><b>메일로 보내기</b><small>원본 엑셀을 내려받고 메일 쓰기 창을 엶 — 파일은 직접 첨부</small></span></button>
          <hr>
          <button data-act="orig"><span>📗</span><span><b>원본 엑셀 내려받기</b><small id="origInfo">이 카탈로그에 들어 있는 장비관리대장 원본</small></span></button>
          <button data-act="xlsx"><span>📊</span><span><b>보이는 장비 → 엑셀(.xlsx)</b><small>현재 필터 결과 + 장비구성 시트</small></span></button>
          <button data-act="docx"><span>📄</span><span><b>보이는 장비 → Word 장비관리대장</b><small>현재 필터 결과를 양식(앞면+뒷면)으로</small></span></button>
          <button data-act="print"><span>🖨️</span><span><b>목록 인쇄 / PDF</b><small>지금 보이는 표를 인쇄</small></span></button>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
<!-- ========== 장비 둘러보기 ========== -->
<section id="viewBrowse">
  <div class="wrap searchzone">
    <form class="search" id="searchForm" role="search" onsubmit="return false">
      <div class="seg"><label for="qId">관리번호</label><input id="qId" placeholder="예: 05, 98 (쉼표=여러 개)" autocomplete="off"></div>
      <div class="seg"><label for="qName">물품명</label><input id="qName" placeholder="예: 저울, 분광" autocomplete="off"></div>
      <div class="seg wide"><label for="qAny">통합 검색</label><input id="qAny" placeholder="규격·제조사·도입처·용도·성능·구성품" autocomplete="off"></div>
      <button class="orb" id="orb" type="button" aria-label="검색어 지우기 / 검색">
        <svg width="16" height="16" viewBox="0 0 32 32"><path d="M13 24a11 11 0 1 0 0-22 11 11 0 0 0 0 22zm8-3 9 9" fill="none" stroke="currentColor" stroke-width="4"/></svg></button>
    </form>
  </div>
  <div class="wrap strip">
    <div class="chips" id="priceChips" aria-label="금액 구간"></div>
    <button class="filterbtn" id="btnFilter"><svg width="16" height="16" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3"><path d="M7 16H3m26 0H15M29 6H11M7 6H3m26 20h-4m-4 0H3"/><circle cx="9" cy="6" r="3"/><circle cx="11" cy="16" r="3"/><circle cx="23" cy="26" r="3"/></svg>상세 검색 <span class="badge-n" id="fN" hidden>0</span></button>
  </div>
  <div class="wrap">
    <div class="reshead">
      <h2 id="resTitle">장비</h2><span class="sum" id="resSum"></span>
      <div class="active-filters" id="activeF"></div>
      <span class="sp"></span>
      <select class="sel" id="sort" aria-label="정렬">
        <option value="id">관리번호순</option><option value="name">물품명순</option>
        <option value="dateD">도입일 최신순</option><option value="dateA">도입일 오래된순</option>
        <option value="priceD">금액 높은순</option><option value="priceA">금액 낮은순</option>
      </select>
      <div class="seg2" role="group" aria-label="보기 방식">
        <button id="vGrid" aria-pressed="true" title="사진 카드"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>카드</button>
        <button id="vTable" aria-pressed="false" title="표"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="1" y="7" width="14" height="2" rx="1"/><rect x="1" y="12" width="14" height="2" rx="1"/></svg>표</button>
      </div>
    </div>
    <div id="results"></div>
  </div>
</section>

<!-- ========== 엑셀 원본 보기 ========== -->
<section id="viewSheet" hidden>
  <div class="wrap">
    <div class="sheetbar">
      <div class="chips" id="sheetTabs"></div>
      <span class="sp"></span>
      <label class="sbox"><svg width="14" height="14" viewBox="0 0 32 32"><path d="M13 24a11 11 0 1 0 0-22 11 11 0 0 0 0 22zm8-3 9 9" fill="none" stroke="currentColor" stroke-width="4"/></svg><input id="sheetQ" placeholder="이 시트에서 찾기"></label>
      <label class="togglerow" style="padding:0;gap:8px"><span class="switch"><input type="checkbox" id="sheetWrap"><span></span></span>줄바꿈</label>
      <button class="btn" id="sheetDl">원본 엑셀 내려받기</button>
    </div>
    <div class="sheetmeta" id="sheetMeta"></div>
    <div class="xls" id="sheetTable"></div>
  </div>
</section>
</main>
<footer class="wrap footer" id="footer"></footer>
<!-- ========== 편집 알림 띠 ========== -->
<div class="editbar" id="editbar" hidden><div class="wrap ebin">
  <span><b id="editN">0</b>건 고침 · 이 브라우저에만 임시 저장되어 있습니다. 확정하려면 내보내세요.</span><span class="sp"></span>
  <button class="btn ghost" id="eDiscard">되돌리기</button><button class="btn" id="eHtml">관리대장 파일 저장</button><button class="btn dark" id="eXlsx">통합 엑셀 내보내기</button>
</div></div>
<!-- ========== 직인 관리 모달 ========== -->
<div class="scrim" id="people" aria-hidden="true"><div class="dialog narrow" role="dialog" aria-modal="true" aria-label="직인 관리">
  <div class="dhead"><button class="iconbtn" data-close aria-label="닫기">✕</button><h3>담당자·팀장 직인 관리</h3><span style="width:40px"></span></div>
  <div class="dbody" id="peopleBody"></div>
</div></div>

<!-- ========== 상세 모달 ========== -->
<div class="scrim" id="detail" aria-hidden="true"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dtTitle" id="detailBox"></div></div>
<!-- ========== 상세 검색 모달 ========== -->
<div class="scrim" id="filters" aria-hidden="true"><div class="dialog narrow" role="dialog" aria-modal="true" aria-label="상세 검색">
  <div class="dhead"><button class="iconbtn" data-close aria-label="닫기">✕</button><h3>상세 검색</h3><span style="width:40px"></span></div>
  <div class="dbody" id="filterBody"></div>
  <div class="dfoot"><button class="btn ghost" id="fClear" style="text-decoration:underline">전체 해제</button><button class="btn primary" id="fApply">장비 0개 보기</button></div>
</div></div>
<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="toast" id="toast" role="status"></div>

<script data-eq>/* ==== shared/js/00_core.js ==== */
/* [부품 S0] 공통 유틸 — 문자열 정규화, 이스케이프, 크기 표시 등
 * 다른 모든 부품이 EQ.util 을 사용한다. (브라우저 전용, 외부 의존 없음) */
(function (EQ) {
  'use strict';
  const nfc = s => String(s ?? '').normalize('NFC');
  const util = {
    nfc,
    /** 관리번호 비교용 키: NFC·하이픈 통일·공백 제거·소문자 */
    normKey: s => nfc(s).replace(/[‐-―−ー－]/g, '-').replace(/\s+/g, '').toLowerCase(),
    /** 엑셀 머리글 비교용: 공백 제거·소문자 */
    normHdr: s => nfc(s).replace(/\s+/g, '').toLowerCase(),
    /** Word XML 에 넣을 수 없는 제어문자 제거, 줄바꿈 통일 */
    cleanXml: s => String(s ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '').replace(/\r\n?/g, '\n'),
    esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    fmtBytes: n => n >= 1048576 ? (n / 1048576).toFixed(2) + 'MB' : Math.round(n / 1024) + 'KB',
    sleep: ms => new Promise(r => setTimeout(r, ms || 0)),
    safeName: s => nfc(s).replace(/[\\/:*?"<>|\r\n]+/g, '_').trim(),
    stamp() { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}`; },
    /** 자연 정렬 키 (04-장비-5 < 04-장비-40) */
    natKey: s => String(s).replace(/\d+/g, m => m.padStart(8, '0')),
    download(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    },
    b64ToBytes(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; },
    bytesToB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
    /** localStorage 는 막혀 있을 수 있으므로 항상 try/catch */
    store: {
      get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
    },
  };
  EQ.util = util;
})(window.EQ = window.EQ || {});

<script data-eq>/* ==== shared/js/10_format.js ==== */
/* [부품 S1] 날짜·금액 형식 — 엑셀 값(일련번호/Date/문자열) → 화면·양식용 문자열 */
(function (EQ) {
  'use strict';
  const z = n => String(n).padStart(2, '0');
  const fmt = {
    /** 엑셀 날짜 값 → {y,m,d} 또는 null */
    dateParts(v) {
      if (v == null || v === '') return null;
      if (v instanceof Date && !isNaN(v)) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate() };
      if (typeof v === 'number' && isFinite(v) && v > 59 && v < 80000) {          // 엑셀 일련번호
        const t = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
        return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() };
      }
      const m = String(v).match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
      return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
    },
    /** ISO(YYYY-MM-DD) 문자열 — 레코드 저장용 */
    iso(v) { const p = fmt.dateParts(v); return p ? `${p.y}-${z(p.m)}-${z(p.d)}` : ''; },
    /** 표시용. style: dot(2004.07.01) | dash | kr(2004. 7. 1.) | han(2004년 7월 1일) */
    date(v, style) {
      const p = fmt.dateParts(v);
      if (!p) return v == null ? '' : String(v);
      if (style === 'dash') return `${p.y}-${z(p.m)}-${z(p.d)}`;
      if (style === 'kr') return `${p.y}. ${p.m}. ${p.d}.`;
      if (style === 'han') return `${p.y}년 ${p.m}월 ${p.d}일`;
      return `${p.y}.${z(p.m)}.${z(p.d)}`;
    },
    /** 금액 숫자화 (문자 "1,086,000원" 도 허용). 숫자가 아니면 null */
    num(v) {
      if (v == null || v === '') return null;
      const n = typeof v === 'number' ? v : Number(String(v).replace(/[,\s원]/g, ''));
      return isFinite(n) ? n : null;
    },
    won(v) { const n = fmt.num(v); return n == null ? '' : Math.round(n).toLocaleString('ko-KR'); },
    /** 사람이 읽는 금액: 1.5억원, 2,340만원, 85만원 */
    wonShort(v) {
      const n = fmt.num(v); if (n == null) return '-';
      if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 1 : 2).replace(/\.?0+$/, '') + '억원';
      if (n >= 1e4) return Math.round(n / 1e4).toLocaleString('ko-KR') + '만원';
      return Math.round(n).toLocaleString('ko-KR') + '원';
    },
  };
  EQ.fmt = fmt;
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== shared/js/30_text_fit.js ==== */
/* [부품 S3] 글자 크기 자동 맞춤 — 칸(가로·세로 twip)에 글이 넘치지 않는 가장 큰 크기 계산
 *  원리 : 글자별 폭(한글=1em, 영문·숫자는 좁게)으로 줄바꿈을 흉내 내 줄 수를 세고,
 *         줄 간격을 '정확히 크기×lineFactor' 로 고정(Word 의 줄간격 '고정')하므로
 *         글꼴이 없는 PC 에서도 높이 계산이 어긋나지 않는다.
 *  반환 : { size(pt), lines, lineTw(줄 간격 twip), fits(bool) } */
(function (EQ) {
  'use strict';
  const { cleanXml } = EQ.util;
  const FORM = EQ.CONFIG.form;

  // 보수적으로(조금 넓게) 잡은 글자 폭 (em)
  function charW(c) {
    const cc = c.charCodeAt(0);
    if (c === ' ') return 0.33;
    if (cc < 128) {
      if (/[0-9]/.test(c)) return 0.56;
      if (/[A-Z]/.test(c)) return 0.72;
      if (/[mw]/.test(c)) return 0.85;
      if (/[a-z]/.test(c)) return 0.56;
      if (/[.,:;'`|!]/.test(c)) return 0.34;
      if (/[()\[\]\-\/]/.test(c)) return 0.42;
      return 0.62;
    }
    if (cc >= 0x2460 && cc <= 0x24FF) return 1.0;   // ①
    if (cc >= 0x2000 && cc < 0x2E80) return 0.8;    // ℃, ±, → 등
    return 1.0;                                      // 한글·한자
  }

  /** 단어 단위 줄바꿈을 흉내 내 줄 수를 센다 (영문 단어는 통째로 넘김) */
  function countLines(text, widthPt, size) {
    let total = 0;
    for (const para of cleanXml(text).split('\n')) {
      let x = 0, lines = 1;
      const tokens = para.match(/[A-Za-z0-9.,%()\-\/+:]+|\s+|./gu) || [];
      for (const t of tokens) {
        let w = 0; for (const ch of t) w += charW(ch) * size;
        if (/^\s+$/.test(t)) { x += w; continue; }
        if (x + w <= widthPt) { x += w; continue; }
        if (w <= widthPt) { lines++; x = w; continue; }
        for (const ch of t) {                       // 너무 긴 단어는 글자 단위로
          const cw = charW(ch) * size;
          if (x + cw > widthPt) { lines++; x = cw; } else x += cw;
        }
      }
      total += lines;
    }
    return total;
  }

  /**
   * @param text   넣을 글
   * @param wTw    칸 너비(twip)  @param hTw  칸 높이(twip)
   * @param maxPt  기본 크기     @param minPt 최소 크기
   */
  function fit(text, wTw, hTw, maxPt, minPt) {
    const widthPt = (wTw - FORM.cellPadW) / 20 * 0.97;   // 3% 여유
    const availPt = (hTw - FORM.cellPadH) / 20;
    const lf = FORM.lineFactor;
    let s = maxPt, lines = 1;
    for (; s >= minPt - 1e-9; s -= 0.5) {
      lines = countLines(text, widthPt, s);
      if (lines * s * lf <= availPt) return { size: s, lines, lineTw: Math.round(s * lf * 20), fits: true };
    }
    s = minPt; lines = countLines(text, widthPt, s);
    return { size: s, lines, lineTw: Math.round(s * lf * 20), fits: false };
  }
  EQ.fit = { fit, countLines, charW };
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== shared/js/40_docx_builder.js ==== */
/* [부품 S4] Word 문서 조립 — ledger.docx 양식을 복제해 장비마다 앞면(대장)+뒷면(이력표)을 채움
 *  의존 : JSZip, EQ.fit, EQ.fmt, EQ.CONFIG.form

  const halfPt = s => Math.round(s * 2);

  const RPR_AFTER_SZ = ['szCs', 'highlight', 'u', 'effect', 'bdr', 'shd', 'fitText', 'vertAlign', 'rtl', 'cs', 'em', 'lang', 'eastAsianLayout', 'specVanish', 'oMath'];
  const PPR_AFTER_SPACING = ['ind', 'contextualSpacing', 'mirrorIndents', 'suppressOverlap', 'jc', 'textDirection', 'textAlignment', 'textboxTightWrap', 'outlineLvl', 'divId', 'cnfStyle', 'rPr', 'sectPr', 'pPrChange'];
  const el = (doc, name, attrs) => { const e = doc.createElementNS(W_NS, 'w:' + name); for (const [k, v] of Object.entries(attrs || {})) e.setAttributeNS(W_NS, 'w:' + k, String(v)); return e; };

    [...rPr.children].filter(c => c.localName === 'sz' || c.localName === 'szCs').forEach(c => rPr.removeChild(c));
    const sz = el(doc, 'sz', { val: hp }), szCs = el(doc, 'szCs', { val: hp });
    const ref = [...rPr.children].find(c => RPR_AFTER_SZ.includes(c.localName));
    rPr.insertBefore(sz, ref || null); rPr.insertBefore(szCs, ref || null);
  }

  function setExactSpacing(doc, p, lineTw) {
    let pPr = kids(p, 'pPr')[0];

    kids(pPr, 'spacing').forEach(s => pPr.removeChild(s));

  function fillFit(doc, p, text, wTw, hTw, max, min, force) {
    const f = EQ.fit.fit(text, wTw, hTw, max, min);
    const shrink = f.size < max;
    setPar(doc, p, text, (shrink || force) ? { size: shrink ? f.size : null, lineTw: f.lineTw } : {});

  }

  function vCenter(doc, tc) {
    let pr = kids(tc, 'tcPr')[0]; if (!pr) { pr = el(doc, 'tcPr'); tc.insertBefore(pr, tc.firstChild); }
    let v = kids(pr, 'vAlign')[0]; if (!v) { v = el(doc, 'vAlign'); pr.insertBefore(v, kids(pr, 'hideMark')[0] || null); }

    /** 직인 목록 [{role,name,img(dataURL)}] → Map('역할|성명' → {bytes,ext,w,h,key}) — 브라우저에서 그림 크기 확인 */
    static async prepareStamps(people) {

      for (const p of people || []) {
