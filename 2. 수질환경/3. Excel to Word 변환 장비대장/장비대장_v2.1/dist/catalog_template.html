      p.appendChild(this.doc.importNode(dx.documentElement, true));
    }
    /** 뒷면 '수리 또는 부품 교체 이력' 표 채우기 (왼쪽 11칸 → 오른쪽 11칸) */
    _fillHistory(t2, entries) {
      const doc = this.doc, HF = FORM.hist, R = rowsOf(t2), stamps = this.opts.stamps || new Map();
      for (let i = 0; i < HF.rowsPerSide * 2; i++) {
        const side = i < HF.rowsPerSide ? 0 : 4, tr = R[HF.firstRow + (i % HF.rowsPerSide)];
        const cs = cellsOf(tr), h = entries[i];
        if (!h) continue;
        setPar(doc, parsOf(cs[side])[0], EQ.fmt.date(h.d, this.opts.dateStyle) || h.d || '');
        const f = EQ.fit.fit(h.c, HF.contentW, HF.rowH, HF.max, HF.min);
        setPar(doc, parsOf(cs[side + 1])[0], h.c, { size: f.size, lineTw: f.lineTw });
        vCenter(doc, cs[side + 1]);
        [[h.m, '담당자', 2], [h.l, '팀장', 3]].forEach(([nm, role, off]) => {
          if (!nm) return;
          const p = parsOf(cs[side + off])[0]; centerPar(doc, p);
          const st = stamps.get(role + '|' + nm);
          if (st) this._picture(p, st, HF.stampBoxW, HF.stampBoxH, `${role} ${nm}`);
          else setPar(doc, p, nm, { size: 8 });
        });
      }
    }
    static async create(templateB64, opts) {
      const zip = await JSZip.loadAsync(templateB64, { base64: true });
      const xml = await zip.file('word/document.xml').async('string');
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      if (doc.getElementsByTagName('parsererror').length) throw new Error('양식 XML 해석 오류');
      return new DocBuilder(zip, doc, opts);
    }
    _addPhoto(photo) {
      const key = photo.key || ('p' + this.imgSeq);
      if (this.relOf.has(key)) return this.relOf.get(key);
      const n = ++this.imgSeq, rid = 'rIdPhoto' + n, path = `media/photo${n}.${photo.ext}`;
      this.zip.file('word/' + path, photo.bytes);
      this.rels.push(`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${path}"/>`);
      this.mediaExt.add(photo.ext); this.relOf.set(key, rid); return rid;
    }
    /** 장비 1대(앞면+뒷면) 추가. 반환: 경고 문자열 배열 */
    append(rec, photo) {
      const doc = this.doc, warn = [];
      const f = this.pristine.map(n => n.cloneNode(true));
      f.forEach(n => [...n.getElementsByTagNameNS(W_NS, 'lastRenderedPageBreak')].forEach(e => e.parentNode.removeChild(e)));
      f.forEach(n => [...n.getElementsByTagName('*')].forEach(e => {
        if (e.localName === 'docPr' || (e.localName === 'cNvPr' && e.hasAttribute('id'))) e.setAttribute('id', String(++this.docPrId));
      }));
      const [t0, t1, pFront, pBreak, pHead, t2, pBack] = f;
      const nameLine = `물품명 : ${rec.name}`, idLine = `관리번호 (${rec.id})`;
      const R = rowsOf(t1), c0 = cellsOf(R[0]), c1 = cellsOf(R[1]);

      // 제목줄
      const NL = FORM.nameLine;
      fillFit(doc, parsOf(c0[0])[0], nameLine, NL.w, NL.h, NL.max, NL.min);
      setPar(doc, parsOf(c0[1])[0], idLine);
      setPar(doc, parsOf(c1[1])[0], rec.item ? `물품번호 ${rec.item}` : '');

      // 기본 정보(3행 병합 칸)
      const r4 = cellsOf(R[4]), H = FORM.infoCellH, I = FORM.info;
      const put = (tc, text, k) => {
        const r = fillFit(doc, parsOf(tc)[0], text, I[k].w, H, I[k].max, I[k].min);
        if (!r.fits) warn.push(`${k} 칸 글이 길어 최소 크기(${I[k].min}pt)로도 넘칠 수 있음`);
      };
      put(r4[0], rec.spec, 'spec');
      { // 제작회사 / (제조국) — 두 문단
        const ps = parsOf(r4[1]), mk = rec.maker, co = rec.country ? `(${rec.country})` : '';
        const a = EQ.fit.fit(mk, I.maker.w, H / 2, I.maker.max, I.maker.min), b = EQ.fit.fit(co, I.maker.w, H / 2, I.maker.max, I.maker.min);
        const s = Math.min(a.size, b.size), o = s < I.maker.max ? { size: s, lineTw: Math.round(s * FORM.lineFactor * 20) } : {};
        setPar(doc, ps[0], mk, o); setPar(doc, ps[1], co, o);
      }
      put(r4[2], EQ.fmt.date(rec.date, this.opts.dateStyle), 'date');
      setPar(doc, parsOf(r4[3])[0], EQ.fmt.won(rec.price));
      put(r4[4], rec.vendor, 'vendor');
      put(r4[5], rec.addr, 'addr');
      put(r4[6], rec.tel, 'tel');
      put(r4[7], rec.usage, 'usage');

      const r6 = cellsOf(R[6]);
      const used = /중고/.test(rec.cond), isNew = /신품|신규|새/.test(rec.cond);
      setPar(doc, parsOf(r6[3])[0], (isNew ? '■' : '□') + ' 신품');
      setPar(doc, parsOf(r6[4])[0], (used ? '■' : '□') + '중고품');

      // 주요 성능 및 특징 — 항상 고정 줄간격(줄 수가 많아도 행이 늘지 않게)
      const r7 = cellsOf(R[7]), N = FORM.note;
      { const ps = parsOf(r7[0]);
        const fr = fillFit(doc, ps[1] || ps[0], rec.note, N.w, N.h - N.labelH, N.max, N.min, true);
        if (!fr.fits) warn.push(`주요 성능 및 특징이 매우 길어(약 ${fr.lines}줄) 최소 ${N.min}pt로도 한 쪽을 넘을 수 있음`);
        else if (fr.size < N.max) warn.push(`주요 성능 및 특징 글자 ${N.max}→${fr.size}pt 축소`);
      }

      // 장비구성내역 (기본 5행, 많으면 행을 늘리고 높이를 나눔)
      const C = FORM.comp, comps = (rec.comps || []).slice(0, C.maxRows);
      if ((rec.comps || []).length > C.maxRows) warn.push(`구성내역 ${rec.comps.length}행 중 ${C.maxRows}행만 반영`);
      const compRows = R.slice(10, 10 + C.baseRows), total = Math.max(C.baseRows, comps.length);
      while (compRows.length < total) {
        const last = compRows[compRows.length - 1], nr = last.cloneNode(true);
        last.parentNode.insertBefore(nr, last.nextSibling); compRows.push(nr);
      }
      const rowH = total > C.baseRows ? Math.floor(C.rowH * C.baseRows / total) : C.rowH;
      const base = total > C.baseRows ? Math.max(C.min, C.max - (total - C.baseRows) * 0.5) : C.max;
      compRows.forEach((tr, i) => {
        const trH = tr.getElementsByTagNameNS(W_NS, 'trHeight')[0];
        if (trH) { trH.setAttributeNS(W_NS, 'w:val', String(rowH)); if (total > C.baseRows) trH.setAttributeNS(W_NS, 'w:hRule', 'exact'); }
        const cs = cellsOf(tr), cp = comps[i], o = base < C.max ? { size: base, lineTw: Math.round(base * FORM.lineFactor * 20) } : {};
        setPar(doc, parsOf(cs[0])[0], String(i + 1), o);
        const nf = EQ.fit.fit(cp ? cp.n : '', C.nameW, rowH, base, C.min);
        setPar(doc, parsOf(cs[1])[0], cp ? cp.n : '', nf.size < C.max ? { size: nf.size, lineTw: nf.lineTw } : {});
        setPar(doc, parsOf(cs[2])[0], cp ? cp.q : '', o);
        setPar(doc, parsOf(cs[3])[0], cp ? cp.u : '', o);
      });

      // 사진 (7~14행 병합 칸 안에 비율 유지)
      const pPhoto = parsOf(r7[1])[0];
      kids(pPhoto, 'r').forEach(r => pPhoto.removeChild(r));
      if (photo && photo.bytes) {
        const rid = this._addPhoto(photo), P = FORM.photo;
        const boxW = (P.w - P.pad) * 635, boxH = (N.h + rowH * total + C.rowH * 2 - P.trim) * 635;
        const sc = Math.min(boxW / photo.w, boxH / photo.h);
        const id = ++this.docPrId;
        const dx = new DOMParser().parseFromString(drawingXml(rid, id, '사진 ' + rec.id, Math.round(photo.w * sc), Math.round(photo.h * sc)), 'application/xml');
        pPhoto.appendChild(doc.importNode(dx.documentElement, true));
      }

      // 뒷면 머리글 + 수리 이력 (22건 넘으면 뒷면을 한 쪽 더)
      { const rs = kids(pHead, 'r'); kids(rs[0], 't')[0].textContent = nameLine; kids(rs[1], 't')[0].textContent = idLine; }
      const per = FORM.hist.rowsPerSide * 2, hist = (rec.hist || []).filter(h => h && (h.d || h.c));
      this._fillHistory(t2, hist.slice(0, per));
      const extra = [];
      for (let k = per; k < hist.length; k += per) {
        const [b2, h2, t22, pb2] = [3, 4, 5, 6].map(i => this.pristine[i].cloneNode(true));
        [b2, h2].forEach(n => [...n.getElementsByTagNameNS(W_NS, 'lastRenderedPageBreak')].forEach(e => e.parentNode.removeChild(e)));
        { const rs = kids(h2, 'r'); kids(rs[0], 't')[0].textContent = nameLine; kids(rs[1], 't')[0].textContent = idLine + ` — 이력 ${k / per + 1}쪽`; }
        this._fillHistory(t22, hist.slice(k, k + per));
        extra.push(b2, h2, t22, pb2);
      }
      if (extra.length) warn.push(`수리 이력 ${hist.length}건 → 뒷면 ${Math.ceil(hist.length / per)}쪽`);

      if (this.count > 0) {
        const br = this.pristine[3].cloneNode(true);
        [...br.getElementsByTagNameNS(W_NS, 'lastRenderedPageBreak')].forEach(e => e.parentNode.removeChild(e));
        this.body.appendChild(br);
      }
      [t0, t1, pFront, pBreak, pHead, t2, pBack, ...extra].forEach(n => this.body.appendChild(n));
      this.count++;
      return warn;
    }
    async finish() {
      this.body.appendChild(this.sect);
      const xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(this.doc).replace(/^<\?xml[^>]*\?>\s*/, '');
      this.zip.file('word/document.xml', xml);
      let rels = await this.zip.file('word/_rels/document.xml.rels').async('string');
      this.zip.file('word/_rels/document.xml.rels', rels.replace('</Relationships>', this.rels.join('') + '</Relationships>'));
      let ct = await this.zip.file('[Content_Types].xml').async('string');
      const mime = { jpg: 'image/jpeg', png: 'image/png' };
      this.mediaExt.forEach(e => { if (!new RegExp(`Extension="${e}"`, 'i').test(ct)) ct = ct.replace('<Default ', `<Default Extension="${e}" ContentType="${mime[e]}"/><Default `); });
      this.zip.file('[Content_Types].xml', ct);
      return this.zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 },
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    }
  }
  EQ.DocBuilder = DocBuilder;
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== shared/js/50_xlsx_writer.js ==== */
/* [부품 S5] 간이 엑셀(.xlsx) 쓰기 — 카탈로그 '필터 결과 엑셀로 내보내기'용 (JSZip 필요)
 *  EQ.xlsxWrite([{name:'장비목록', rows:[[머리글...],[값...]], widths:[12,30,...]}]) → Promise<Blob>
 *  숫자는 숫자 셀, 나머지는 문자열(inlineStr). 첫 행은 굵게+자동필터+틀고정. */
(function (EQ) {
  'use strict';
  const xe = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const colName = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

  function sheetXml(rows, widths) {
    const w = Math.max(1, ...rows.map(r => r.length));
    const cols = (widths || []).map((cw, i) => `<col min="${i + 1}" max="${i + 1}" width="${cw}" customWidth="1"/>`).join('');
    const body = rows.map((r, ri) => `<row r="${ri + 1}">` + r.map((v, ci) => {
      const ref = colName(ci) + (ri + 1), st = ri === 0 ? ' s="1"' : ' s="2"';
      if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${ri === 0 ? st : ' s="3"'}><v>${v}</v></c>`;
      if (v == null || v === '') return '';
      return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
    }).join('') + '</row>').join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
      + `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
      + (cols ? `<cols>${cols}</cols>` : '') + `<sheetData>${body}</sheetData>`
      + (rows.length > 1 ? `<autoFilter ref="A1:${colName(w - 1)}${rows.length}"/>` : '') + `</worksheet>`;
  }

  async function xlsxWrite(sheets) {
    const z = new JSZip();
    z.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`
      + sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + `</Types>`);
    z.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
    z.file('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>`
      + sheets.map((s, i) => `<sheet name="${xe(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + `</sheets></workbook>`);
    z.file('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')
      + `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
    z.file('xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts><fonts count="2"><font><sz val="10"/><name val="맑은 고딕"/></font><font><b/><sz val="10"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF2F2F2"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="4"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"><alignment vertical="center" wrapText="1"/></xf><xf applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="164" applyNumberFormat="1"><alignment vertical="top"/></xf></cellXfs></styleSheet>`);
    sheets.forEach((s, i) => z.file(`xl/worksheets/sheet${i + 1}.xml`, sheetXml(s.rows, s.widths)));
    return z.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  EQ.xlsxWrite = xlsxWrite;
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== shared/js/60_xlsx_patch.js ==== */
/* [부품 S6] 통합 엑셀 고쳐 쓰기 — 원본 xlsx 는 그대로 두고 지정한 시트의 '내용(sheetData)'만 바꾸거나 새 시트를 붙인다.
 *  다른 시트(장비대장·이관장비 등)의 서식·수식·필터는 손대지 않는다. (JSZip 필요)
 *  EQ.xlsxPatch(원본 Uint8Array, [{name, header:[..], rows:[[..]], widths:[..]}]) → Promise<Blob>
 *  - 이미 있는 시트: 머리글/본문 칸 서식(s)을 원래 시트의 1·2행에서 가져와 그대로 사용
 *  - 없는 시트: 맨 뒤에 새로 추가(머리글 고정·자동필터) */
(function (EQ) {
  'use strict';
  const xe = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';

  function cellsXml(header, rows, hs, ds) {
    const all = [header, ...rows];
    return all.map((r, ri) => `<row r="${ri + 1}">` + r.map((v, ci) => {
      const ref = col(ci) + (ri + 1), st = ri === 0 ? hs[ci] : ds[ci], sa = st != null ? ` s="${st}"` : '';
      if (v == null || v === '') return st != null ? `<c r="${ref}"${sa}/>` : '';
      if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${sa}><v>${v}</v></c>`;
      return `<c r="${ref}"${sa} t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
    }).join('') + '</row>').join('');
  }
  /** 원래 시트에서 r행의 열별 서식 번호 */
  function rowStyles(xml, r, w) {
    const out = new Array(w).fill(null);
    const m = new RegExp(`<row [^>]*r="${r}"[^>]*>([\\s\\S]*?)</row>`).exec(xml); if (!m) return out;
    for (const c of m[1].matchAll(/<c r="([A-Z]+)\d+"([^>]*?)\/?>/g)) {
      const s = /\ss="(\d+)"/.exec(c[2]); if (!s) continue;
      let i = 0; for (const ch of c[1]) i = i * 26 + ch.charCodeAt(0) - 64; i--;
      if (i < w) out[i] = s[1];
    }
    return out;
  }

  async function xlsxPatch(bytes, specs) {
    const z = await JSZip.loadAsync(bytes);
    let wbx = await z.file('xl/workbook.xml').async('string');
    let rels = await z.file('xl/_rels/workbook.xml.rels').async('string');
    let ct = await z.file('[Content_Types].xml').async('string');
    const sheetTags = [...wbx.matchAll(/<sheet [^>]*name="([^"]+)"[^>]*r:id="([^"]+)"[^>]*\/>/g)].map(m => ({ name: m[1].replace(/&amp;/g, '&'), rid: m[2] }));
    const target = rid => { const m = new RegExp(`<Relationship [^>]*Id="${rid}"[^>]*Target="([^"]+)"`).exec(rels) || new RegExp(`<Relationship [^>]*Target="([^"]+)"[^>]*Id="${rid}"`).exec(rels); return m ? 'xl/' + m[1].replace(/^\/?xl\//, '') : null; };

    for (const sp of specs) {
      const w = Math.max(sp.header.length, ...sp.rows.map(r => r.length), 1);
      const last = col(w - 1) + (sp.rows.length + 1);
      const idx = sheetTags.findIndex(t => t.name === sp.name);
      if (idx >= 0) {
        const path = target(sheetTags[idx].rid); let xml = await z.file(path).async('string');
        const hs = rowStyles(xml, 1, w), ds = rowStyles(xml, 2, w);
        xml = xml.replace(/<sheetData\/>|<sheetData>[\s\S]*?<\/sheetData>/, `<sheetData>${cellsXml(sp.header, sp.rows, hs, ds)}</sheetData>`)
                 .replace(/<dimension ref="[^"]*"\/>/, `<dimension ref="A1:${last}"/>`)
                 .replace(/(<autoFilter [^>]*ref=")[^"]*"/, (m, g1) => `${g1}A1:${last}"`);
        z.file(path, xml);
        // 필터 범위 이름(_FilterDatabase) 갱신
        const ref = `${sp.name}!$A$1:$${col(w - 1)}$${sp.rows.length + 1}`;
        wbx = wbx.replace(new RegExp(`(<definedName name="_xlnm._FilterDatabase" localSheetId="${idx}"[^>]*>)[^<]*`), (m, g1) => g1 + ref);
      } else {
        let n = 1; while (z.file(`xl/worksheets/sheet${n}.xml`)) n++;
        const path = `xl/worksheets/sheet${n}.xml`;
        let rn = 1; while (new RegExp(`Id="rId${rn}"`).test(rels)) rn++;
        const sid = Math.max(0, ...[...wbx.matchAll(/sheetId="(\d+)"/g)].map(m => +m[1])) + 1;
        const cols = (sp.widths || []).map((cw, i) => `<col min="${i + 1}" max="${i + 1}" width="${cw}" customWidth="1"/>`).join('');
        z.file(path, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${MAIN}"><dimension ref="A1:${last}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>`
          + (cols ? `<cols>${cols}</cols>` : '') + `<sheetData>${cellsXml(sp.header, sp.rows, [], [])}</sheetData><autoFilter ref="A1:${last}"/></worksheet>`);
        wbx = wbx.replace('</sheets>', `<sheet name="${xe(sp.name)}" sheetId="${sid}" r:id="rId${rn}"/></sheets>`);
        rels = rels.replace('</Relationships>', `<Relationship Id="rId${rn}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${n}.xml"/></Relationships>`);
        ct = ct.replace('</Types>', `<Override PartName="/${path}" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`);
        sheetTags.push({ name: sp.name, rid: 'rId' + rn });
      }
    }
    z.file('xl/workbook.xml', wbx); z.file('xl/_rels/workbook.xml.rels', rels); z.file('[Content_Types].xml', ct);
    return z.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  EQ.xlsxPatch = xlsxPatch;
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/10_store.js ==== */
/* [부품 C1] 카탈로그 저장소 — 내장 데이터(EQ_DATA) + 편집층(장비구성·수리이력·직인) + 필터 상태 + 관심 장비
 *  편집 내용은 이 브라우저(localStorage)에 자동 임시 저장되고, '통합 엑셀 내보내기'·'관리대장 파일 저장'으로 확정한다.
 *  다른 카탈로그 부품은 EQ.cat 의 S(상태)·R(레코드)·compsOf/histOf/people·set*·on/emit 만 사용한다. */
(function (EQ) {
  'use strict';
  const { normKey, store } = EQ.util;
  const CFG = EQ.CONFIG;
  const D = window.EQ_DATA;
  if (!D) throw new Error('카탈로그 데이터가 없습니다.');
  D.compsAll = D.compsAll || {}; D.histAll = D.histAll || {}; D.people = D.people || [];
  const norm = s => String(s ?? '').normalize('NFC').toLowerCase().replace(/[‐-―−]/g, '-').replace(/\s+/g, '');
  const srcTag = D.docId || ((D.source && D.source.name || 'default') + '|' + D.generated);

  // ---- 편집층 ----
  const EDIT_KEY = 'eq-edit:' + srcTag;
  const E = Object.assign({ comps: {}, hist: {}, people: null }, store.get(EDIT_KEY, {}));
  const saveEdits = () => { E.ts = Date.now(); store.set(EDIT_KEY, E); };

  const R = D.records.map((r, i) => Object.assign(r, { _i: i, _id: normKey(r.id), key: r.key || normKey(r.id), _fav: false }));
  const compsOf = key => (E.comps[key] || D.compsAll[key] || []);
  const histOf = key => (E.hist[key] || D.histAll[key] || []);
  function refreshRecord(r) {
    r.comps = compsOf(r.key); r.hist = histOf(r.key);
    r._name = norm(r.name) + '|' + norm(r.nameExt);
    r._any = norm([r.spec, r.maker, r.country, r.vendor, r.addr, r.tel, r.usage, r.note, r.item, r.serial, r.remark, r.place,
      r.comps.map(c => c.n).join(' '), r.hist.map(h => h.c).join(' ')].join(' '));
    r._total = r.price == null ? null : r.price * (r.qty || 1);
  }
  R.forEach(refreshRecord);

  const FAV_KEY = 'eq-catalog-fav:' + (D.source && D.source.name || 'default');
  const favSet = new Set(store.get(FAV_KEY, []));
  R.forEach(r => { r._fav = favSet.has(r.uid); });

  // ---- 구분(시트) 탭 ----
  const order = n => { const i = CFG.sheets.order.indexOf(n); return i < 0 ? 50 : i; };
  const cats = [...new Set(R.map(r => r.sheet))].sort((a, b) => order(a) - order(b));

  const years = R.map(r => r.year).filter(Boolean);
  const S = {
    cat: cats[0] || '',                      // 지금 보는 구분(시트)
    ids: [], names: [], any: [], bucket: null, pmin: null, pmax: null, basis: 'unit',
    yMin: null, yMax: null, countries: new Set(), sheets: new Set(),
    photo: false, comps: false, fav: false,
    sort: store.get('eq-catalog-sort', 'id'), view: store.get('eq-catalog-view', 'grid'),
    list: [], yearRange: years.length ? [Math.min(...years), Math.max(...years)] : [null, null],
  };

  const subs = {};
  const cat = {
    D, R, S, E, norm, cats,
    on(ev, fn) { (subs[ev] = subs[ev] || []).push(fn); },
    emit(ev, arg) { (subs[ev] || []).forEach(fn => fn(arg)); },
    tokens: v => norm(v).split(',').map(s => s.trim()).filter(Boolean),
    image: key => (key && D.images[key]) || null,
    compsOf, histOf,
    /** 직인 등록 목록 [{role,name,start,note,img}] */
    people: () => (E.people || D.people),
    /** 역할별 '현재' 사람 = 사용 시작일이 오늘 이전 중 가장 최근 */
    currentOf(role) {
      const today = new Date().toISOString().slice(0, 10);
      const list = cat.people().filter(p => p.role === role).sort((a, b) => (a.start || '').localeCompare(b.start || ''));
      const past = list.filter(p => !p.start || p.start <= today);
      return (past.length ? past[past.length - 1] : list[list.length - 1]) || null;
    },
    stampOf(role, name) { const p = cat.people().find(x => x.role === role && x.name === name); return p && p.img ? p.img : null; },
    setComps(key, list) { E.comps[key] = list; R.filter(r => r.key === key).forEach(refreshRecord); saveEdits(); cat.emit('edit'); },
    setHist(key, list) { E.hist[key] = list; R.filter(r => r.key === key).forEach(refreshRecord); saveEdits(); cat.emit('edit'); },
    setPeople(list) { E.people = list; saveEdits(); cat.emit('edit'); },
    changeCount: () => Object.keys(E.comps).length + Object.keys(E.hist).length + (E.people ? 1 : 0),
    discardEdits() { E.comps = {}; E.hist = {}; E.people = null; saveEdits(); R.forEach(refreshRecord); cat.emit('edit'); },
    /** 편집을 반영한 전체 맵 (내보내기용) */
    mergedComps() { const m = { ...D.compsAll }; Object.entries(E.comps).forEach(([k, v]) => { m[k] = v; }); return m; },
    mergedHist() { const m = { ...D.histAll }; Object.entries(E.hist).forEach(([k, v]) => { m[k] = v; }); return m; },
    toggleFav(r) { r._fav = !r._fav; r._fav ? favSet.add(r.uid) : favSet.delete(r.uid); store.set(FAV_KEY, [...favSet]); cat.emit('fav'); },
    favCount: () => favSet.size,
    toast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(cat._tt); cat._tt = setTimeout(() => t.classList.remove('show'), 2800);
    },
  };
  EQ.cat = cat;
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/20_filters.js ==== */
/* [부품 C2] 필터·정렬 — 상태(S)로 레코드를 걸러 S.list 를 만든다
 *  금액 : 구간 칩(config.priceBuckets) 또는 상세 최소~최대(원) 중 하나만 적용 (상세가 우선) */
(function (EQ) {
  'use strict';
  const cat = EQ.cat, { S, R } = cat;
  const BUCKETS = EQ.CONFIG.priceBuckets;
  const priceOf = r => (S.basis === 'total' ? r._total : r.price);

  function priceRange() {
    if (S.pmin != null || S.pmax != null) return [S.pmin, S.pmax];
    if (S.bucket != null) { const b = BUCKETS[S.bucket]; return [b.min, b.max]; }
    return [null, null];
  }
  const inPrice = (p, lo, hi) => p != null && (lo == null || p >= lo) && (hi == null || p < hi + (S.pmax != null ? 1 : 0));

  /** opt.skipPrice: 칩별 개수를 셀 때 금액 조건만 빼고 거르기 */
  function match(r, opt) {
    if (S.cat && r.sheet !== S.cat) return false;
    if (S.ids.length && !S.ids.some(t => r._id.includes(t))) return false;
    if (S.names.length && !S.names.some(t => r._name.includes(t))) return false;
    if (S.any.length && !S.any.some(t => r._any.includes(t) || r._name.includes(t) || r._id.includes(t))) return false;
    if (S.sheets.size && !S.sheets.has(r.sheet)) return false;
    if (S.countries.size && !S.countries.has(r.country || '(미상)')) return false;
    if (S.yMin != null && !(r.year >= S.yMin)) return false;
    if (S.yMax != null && !(r.year <= S.yMax)) return false;
    if (S.photo && !r.ph) return false;
    if (S.comps && !(r.comps && r.comps.length)) return false;
    if (S.fav && !r._fav) return false;
    if (!(opt && opt.skipPrice)) {
      const [lo, hi] = priceRange();
      if ((lo != null || hi != null) && !inPrice(priceOf(r), lo, hi)) return false;
    }
    return true;
  }

  const SORTS = {
    id: (a, b) => EQ.util.natKey(a.id).localeCompare(EQ.util.natKey(b.id)) || a._i - b._i,
    name: (a, b) => a.name.localeCompare(b.name, 'ko') || a._i - b._i,
    dateD: (a, b) => (b.date || '').localeCompare(a.date || ''),
    dateA: (a, b) => (a.date || '9999').localeCompare(b.date || '9999'),
    priceD: (a, b) => (priceOf(b) ?? -1) - (priceOf(a) ?? -1),
    priceA: (a, b) => (priceOf(a) ?? Infinity) - (priceOf(b) ?? Infinity),
  };

  function apply() {
    S.list = R.filter(r => match(r)).sort(SORTS[S.sort] || SORTS.id);
    cat.emit('change');
  }
  /** 금액 칩별 개수 (금액 외 조건은 반영) */
  function bucketCounts() {
    const base = R.filter(r => match(r, { skipPrice: true }));
    return BUCKETS.map(b => base.filter(r => inPrice(priceOf(r), b.min, b.max)).length);
  }
  /** 상세 검색 조건 수 (배지 표시용) */
  function activeCount() {
    return (S.pmin != null || S.pmax != null ? 1 : 0) + (S.yMin != null || S.yMax != null ? 1 : 0)
      + (S.countries.size ? 1 : 0) + (S.sheets.size ? 1 : 0) + (S.photo ? 1 : 0) + (S.comps ? 1 : 0) + (S.basis === 'total' ? 1 : 0);
  }
  function reset(all) {
    Object.assign(S, { bucket: null, pmin: null, pmax: null, basis: 'unit', yMin: null, yMax: null, photo: false, comps: false });
    S.countries.clear(); S.sheets.clear();
    if (all) { S.ids = []; S.names = []; S.any = []; S.fav = false; }
  }
  Object.assign(cat, { apply, match, bucketCounts, activeCount, reset, priceOf, priceRange, BUCKETS });
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/30_results.js ==== */
/* [부품 C3] 결과 화면 — 금액 구간 칩, 결과 머리(개수·합계·적용 조건), 카드 격자 / 표 */
(function (EQ) {
  'use strict';
  const cat = EQ.cat, { S } = cat, { esc } = EQ.util, F = EQ.fmt;
  const $ = id => document.getElementById(id);
  const ICON_NOIMG = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 17-5-5-8 8"/></svg>';
  const HEART = '<svg width="24" height="24" viewBox="0 0 32 32"><path d="M16 28c7-4.7 14-10 14-17a6.8 6.8 0 0 0-14-3 6.8 6.8 0 0 0-14 3c0 7 7 12.3 14 17z"/></svg>';

  /** 검색어와 맞는 글자 강조 (공백 무시) */
  function hl(text, toks) {
    let s = esc(text); if (!toks.length) return s;
    for (const t of toks) {
      const re = new RegExp('(' + [...t].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s*') + ')', 'gi');
      s = s.replace(re, m => (/[<&>]/.test(m) ? m : `<mark>${m}</mark>`));
    }
    return s;
  }
  cat.hl = hl;

  function renderChips() {
    const counts = cat.bucketCounts(), detail = S.pmin != null || S.pmax != null;
    $('priceChips').innerHTML =
      `<button class="chip" data-b="" aria-pressed="${S.bucket == null && !detail}">전체 금액</button>` +
      cat.BUCKETS.map((b, i) => `<button class="chip" data-b="${i}" aria-pressed="${S.bucket === i && !detail}">${esc(b.label)}<span class="c">${counts[i]}</span></button>`).join('') +
      (detail ? `<button class="chip" aria-pressed="true" data-b="detail">${esc(rangeLabel())} ✕</button>` : '');
  }
  function rangeLabel() {
    const a = S.pmin != null ? F.wonShort(S.pmin) : '', b = S.pmax != null ? F.wonShort(S.pmax) : '';
    return (S.basis === 'total' ? '총액 ' : '') + (a && b ? `${a}~${b}` : a ? `${a} 이상` : `${b} 이하`);
  }

  function renderHead() {
    const L = S.list, sum = L.reduce((t, r) => t + (cat.priceOf(r) || 0), 0);
    $('resTitle').textContent = `장비 ${L.length.toLocaleString()}대`;
    $('resSum').textContent = L.length ? `· ${S.basis === 'total' ? '총액' : '금액'} 합계 ${F.wonShort(sum)}` : '';
    const pills = [];
    const add = (label, key) => pills.push(`<button class="af" data-clear="${key}">${esc(label)} ✕</button>`);
    if (S.ids.length) add('관리번호: ' + $('qId').value, 'ids');
    if (S.names.length) add('물품명: ' + $('qName').value, 'names');
    if (S.any.length) add('검색: ' + $('qAny').value, 'any');
    if (S.yMin != null || S.yMax != null) add(`도입 ${S.yMin ?? ''}~${S.yMax ?? ''}년`, 'year');
    if (S.countries.size) add('제조국: ' + [...S.countries].join(', '), 'countries');
    if (S.sheets.size) add('구분: ' + [...S.sheets].join(', '), 'sheets');
    if (S.photo) add('사진 있음', 'photo');
    if (S.comps) add('구성내역 있음', 'comps');
    if (S.fav) add('관심 장비', 'fav');
    $('activeF').innerHTML = pills.join('');
    const n = cat.activeCount(); $('fN').hidden = !n; $('fN').textContent = n;
  }

  function cardHtml(r, k) {
    const img = cat.image(r.ph);
    const badge = r.sheet !== '장비대장' ? r.sheet : (r.comps && r.comps.length ? `구성 ${r.comps.length}` : '');
    const ids = S.ids, nms = S.names;
    return `<article class="card" data-k="${k}" tabindex="0" aria-label="${esc(r.id + ' ' + r.name)}">
      <div class="ph">${img ? `<img loading="lazy" decoding="async" src="${img}" alt="">` : `<div class="noimg"><div>${ICON_NOIMG}사진 없음</div></div>`}
        ${badge ? `<span class="fbadge">${esc(badge)}</span>` : ''}
        <button class="heart" data-fav="${k}" aria-pressed="${r._fav}" aria-label="관심 장비">${HEART}</button></div>
      <div class="meta"><div class="m1"><span class="mid">${hl(r.id, ids)}</span><span class="myear">${r.year ? r.year + '년 도입' : ''}</span></div>
        <div class="mname">${hl(r.name, nms)}</div>
        <div class="mspec">${esc([r.spec, r.maker].filter(Boolean).join(' · ').replace(/\s*\n\s*/g, ' ')) || '&nbsp;'}</div>
        <div class="mprice"><b>${esc(F.wonShort(r.price))}</b>${r.qty > 1 ? ` <span class="myear">× ${r.qty}</span>` : ''}</div></div>
    </article>`;
  }
  function tableHtml() {
    const ids = S.ids, nms = S.names;
    return `<div class="tablewrap"><table class="t"><thead><tr><th>사진</th><th data-sort="id">관리번호</th><th data-sort="name">물품명</th><th>규격</th><th>제조사(국)</th><th data-sort="dateD">도입일</th><th data-sort="priceD">금액(원)</th><th>용도</th><th>구성</th><th>구분</th></tr></thead><tbody>` +
      S.list.map((r, k) => { const img = cat.image(r.ph); return `<tr data-k="${k}"><td>${img ? `<img class="thumb" loading="lazy" src="${img}" alt="">` : '<div class="thumb"></div>'}</td>
        <td><b>${hl(r.id, ids)}</b></td><td>${hl(r.name, nms)}</td><td>${esc(r.spec.replace(/\s*\n\s*/g, ' '))}</td>
        <td>${esc(r.maker)}${r.country ? ` (${esc(r.country)})` : ''}</td><td>${esc(F.date(r.date))}</td><td class="n">${esc(F.won(r.price))}</td>
        <td>${esc(r.usage)}</td><td class="n">${(r.comps || []).length || ''}</td><td>${esc(r.sheet)}</td></tr>`; }).join('') + '</tbody></table></div>';
  }
  function renderList() {
    const box = $('results');
    if (!S.list.length) { box.innerHTML = `<div class="empty"><b>조건에 맞는 장비가 없습니다</b>검색어를 줄이거나 금액·상세 조건을 해제해 보세요.<br><br><button class="btn" id="emptyReset">조건 모두 지우기</button></div>`; return; }
    box.innerHTML = S.view === 'table' ? tableHtml() : `<div class="grid">${S.list.map(cardHtml).join('')}</div>`;
  }
  function render() { renderChips(); renderHead(); renderList(); $('favN').textContent = cat.favCount(); }

  cat.on('change', render);
  cat.on('fav', () => { $('favN').textContent = cat.favCount(); if (S.fav) cat.apply(); else document.querySelectorAll('[data-fav]').forEach(b => { b.setAttribute('aria-pressed', S.list[+b.dataset.fav]._fav); }); });
  cat.results = { render };
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/40_detail.js ==== */
/* [부품 C4] 장비 상세 — 사진·기본정보·도입처·주요 성능·장비구성내역(없어도 빈 표 표시)·오른쪽 요약 카드
 *  열기: EQ.cat.detail.open(목록 위치) / ←·→ 이동, Esc 닫기 */
(function (EQ) {
  'use strict';
  const cat = EQ.cat, { S } = cat, { esc } = EQ.util, F = EQ.fmt;
  const $ = id => document.getElementById(id);
  const I = {
    spec: '<path d="M4 7h16M4 12h10M4 17h7"/>', maker: '<path d="M3 21V9l6 4V9l6 4V5l6 4v12z"/>', globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', tag: '<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    use: '<path d="M9 3h6v5l4 8a3 3 0 0 1-3 4H8a3 3 0 0 1-3-4l4-8z"/>', pin: '<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
    memo: '<path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6"/>', box: '<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7"/>',
    co: '<path d="M4 21V5l8-2v18M12 9h8v12"/>', tel: '<path d="M5 3h4l2 5-3 2a11 11 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A18 18 0 0 1 3 5a2 2 0 0 1 2-2"/>',
  };
  const ico = k => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${I[k]}</svg>`;
  const fact = (k, label, v) => v ? `<div class="fact">${ico(k)}<div><div class="k">${label}</div><div class="v">${esc(v)}</div></div></div>` : '';
  let cur = -1, ed = null;

  function html(r) {
    const img = cat.image(r.ph), active = !/불용|폐기|이관/.test(r.status + r.sheet);
    return `<div class="dhead"><button class="iconbtn" data-close aria-label="닫기">✕</button>
        <h3>${esc(r.id)}</h3>
        <div class="pager"><button class="iconbtn" id="dPrev" aria-label="이전 장비">‹</button><button class="iconbtn" id="dNext" aria-label="다음 장비">›</button>
        <button class="iconbtn heart" style="position:static;border:1px solid var(--hairline);width:40px;height:40px" id="dFav" aria-pressed="${r._fav}" aria-label="관심 장비"><svg width="18" height="18" viewBox="0 0 32 32"><path d="M16 28c7-4.7 14-10 14-17a6.8 6.8 0 0 0-14-3 6.8 6.8 0 0 0-14 3c0 7 7 12.3 14 17z"/></svg></button></div></div>
      <div class="dbody">
        <h1 class="dt-title" id="dtTitle">${esc(r.name)}</h1>
        <div class="dt-sub"><b>${esc(r.id)}</b>${r.item ? `<span class="dot">물품번호 ${esc(r.item)}</span>` : ''}<span class="dot">${esc(r.sheet)}</span>${r.status ? `<span class="dot statusdot ${active ? '' : 'off'}">${esc(r.status)}</span>` : ''}</div>
        <div class="gallery" id="dGal">${img ? `<img src="${img}" alt="${esc(r.name)} 사진">` : '<div class="noimg"><div>사진이 없습니다<br><small>사진 폴더에 관리번호 이름으로 넣고 다시 만들면 표시됩니다</small></div></div>'}</div>
        <div class="dt-cols"><div>
          <section class="sec"><h4>기본 정보</h4><div class="facts">
            ${fact('spec', '규격', r.spec)}${fact('maker', '제조사', r.maker)}${fact('globe', '제조국', r.country)}
            ${fact('cal', '도입일(취득일)', F.date(r.date))}${fact('tag', '구입일련번호', r.serial)}${fact('memo', '물품명(외부 보고용)', r.nameExt && r.nameExt !== r.name ? r.nameExt : '')}
            ${fact('use', '용도', r.usage)}${fact('pin', '장소', r.place)}${fact('memo', '비고', r.remark)}
            ${fact('cal', '이관일', F.date(r.outDate))}${fact('cal', '수관일', F.date(r.inDate))}
          </div></section>
          <section class="sec"><h4>도입처</h4><div class="facts">
            ${fact('co', '회사명', r.vendor) || '<div class="fact"><div class="v" style="color:var(--muted)">도입처 정보가 없습니다</div></div>'}${fact('pin', '주소', r.addr)}${fact('tel', '연락처', r.tel)}${fact('memo', '연락처 비고', r.telNote)}
          </div></section>
          <section class="sec"><h4>주요 성능 및 특징</h4>${r.note ? `<p class="note">${esc(r.note)}</p>` : '<p class="note empty-note">등록된 내용이 없습니다.</p>'}</section>
          <section class="sec" id="secComp"></section>
          <section class="sec" id="secHist"></section>
        </div>
        <aside><div class="rcard">
          <div class="price">${esc(F.wonShort(r.price))}<small>${r.price != null ? esc(F.won(r.price)) + '원' : ''}</small></div>
          ${r.qty > 1 ? `<div style="color:var(--muted)">총액 ${esc(F.wonShort(r._total))} (×${r.qty})</div>` : ''}
          <div class="rgrid"><div><b>도입일</b><span>${esc(F.date(r.date)) || '-'}</span></div><div><b>수량</b><span>${r.qty || 1}</span></div>
            <div><b>사용 상태</b><span>${esc(r.status) || '-'}</span></div><div><b>입고시</b><span>${esc(r.cond) || '-'}</span></div></div>
          <div class="ractions">
            <button class="btn primary block" id="dWord">Word 장비관리대장 내려받기</button>
            <button class="btn block" id="dSheet">엑셀 원본에서 이 행 보기</button>
            <button class="btn ghost block" id="dPrint">이 장비 정보 인쇄</button>
          </div>
          <div class="rhint">엑셀 ${esc(r.sheet)} 시트 ${r.row}행 · ←/→ 키로 이동</div>
        </div></aside></div>
      </div>`;
  }

  function open(k) {
    const r = S.list[k]; if (!r) return;
    if (ed && ed.busy() && cur >= 0 && k !== cur && !confirm('편집 중인 내용이 저장되지 않았습니다. 이동할까요?')) return;
    cur = k; $('detailBox').innerHTML = html(r);
    const sc = $('detail'); sc.classList.add('show'); sc.setAttribute('aria-hidden', 'false'); sc.scrollTop = 0;
    document.body.style.overflow = 'hidden';
    $('dPrev').onclick = () => open((cur - 1 + S.list.length) % S.list.length);
    $('dNext').onclick = () => open((cur + 1) % S.list.length);
    $('dFav').onclick = () => { cat.toggleFav(r); $('dFav').setAttribute('aria-pressed', r._fav); };
    $('dWord').onclick = () => cat.actions.wordFor([r], `${EQ.util.safeName(r.id)}_${EQ.util.safeName(r.name).slice(0, 30)}.docx`);
    $('dSheet').onclick = () => { close(); cat.sheets.show(r.sheet, r.row); };
    $('dPrint').onclick = () => { document.body.classList.add('printing'); window.print(); setTimeout(() => document.body.classList.remove('printing'), 500); };
    const g = $('dGal').querySelector('img'); if (g) $('dGal').onclick = () => { const lb = $('lightbox'); lb.querySelector('img').src = g.src; lb.classList.add('show'); };
    ed = cat.editors.mount(r);
    $('detailBox').querySelector('[data-close]').focus();
  }
  function close() {
    if (ed && ed.busy() && !confirm('편집 중인 내용이 저장되지 않았습니다. 닫을까요?')) return;
    ed = null; $('detail').classList.remove('show'); $('detail').setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; cur = -1; }
  document.addEventListener('keydown', e => {
    if ($('lightbox').classList.contains('show')) { if (e.key === 'Escape') $('lightbox').classList.remove('show'); return; }
    if (cur < 0 || document.getElementById('people').classList.contains('show')) return;
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') open((cur - 1 + S.list.length) % S.list.length);
    else if (e.key === 'ArrowRight') open((cur + 1) % S.list.length);
  });
  $('detail').addEventListener('click', e => { if (e.target === $('detail') || e.target.closest('[data-close]')) close(); });
  $('lightbox').addEventListener('click', () => $('lightbox').classList.remove('show'));
  cat.detail = { open, close, openByUid(uid) {
    const rec = cat.R.find(r => r.uid === uid);
    if (!rec) { cat.toast('이 행은 카탈로그에 없는 장비입니다(중복 제거 또는 제외된 시트).'); return; }
    cat.setTab('browse', rec.sheet);
    let k = S.list.findIndex(r => r.uid === uid);
    if (k < 0) { cat.reset(true); syncInputs(); cat.apply(); k = S.list.findIndex(r => r.uid === uid); }
    open(k);
  } };
  function syncInputs() { ['qId', 'qName', 'qAny'].forEach(i => { $(i).value = ''; }); }
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/45_editors.js ==== */
/* [부품 C4-1] 상세 화면 편집기 — 장비구성내역 / 수리·부품 교체 이력
 *  보기 ↔ 편집을 바꿔 그리며, [저장] 하면 EQ.cat.setComps / setHist 로 편집층에 넣는다(같은 관리번호 장비는 함께 바뀜).
 *  이력의 담당자·팀장은 '직인 관리'에 등록한 사람 중에서 고르고, 새 줄은 각 역할의 '현재' 사람이 기본값. */
(function (EQ) {
  'use strict';
  const cat = EQ.cat, { esc } = EQ.util, F = EQ.fmt, CFG = EQ.CONFIG;
  const today = () => new Date().toISOString().slice(0, 10);
  const PER = CFG.form.hist.rowsPerSide * 2;

  /* ---------- 장비구성내역 ---------- */
  function compView(r) {
    const C = cat.compsOf(r.key), rows = Math.max(C.length, CFG.form.comp.baseRows);
    let h = `<div class="sech"><h4>장비구성내역<span class="cnt">${C.length}건</span></h4><button class="btn sm" data-ed="comp">✎ 편집</button></div>
      <table class="comp"><thead><tr><th>연번</th><th>장비명</th><th style="text-align:center">수량</th><th style="text-align:center">단위</th></tr></thead><tbody>`;
    for (let i = 0; i < rows; i++) {
      const c = C[i];
      h += c ? `<tr><td class="c1">${i + 1}</td><td style="white-space:pre-wrap">${esc(c.n)}</td><td class="c3">${esc(c.q)}</td><td class="c4">${esc(c.u)}</td></tr>`
             : `<tr class="blank"><td class="c1">${i + 1}</td><td>—</td><td class="c3"></td><td class="c4"></td></tr>`;
    }
    h += '</tbody></table>';
    if (!C.length) h += '<p class="comp-empty">등록된 장비구성내역이 없습니다. [✎ 편집]으로 바로 추가할 수 있습니다.</p>';
    if (C.length > CFG.form.comp.maxRows) h += `<p class="comp-empty">Word 양식에는 앞 ${CFG.form.comp.maxRows}행까지 들어갑니다.</p>`;
    return h;
  }
  function compEdit(list) {
    return `<div class="sech"><h4>장비구성내역 편집</h4></div>
      <table class="comp edit"><thead><tr><th>연번</th><th>장비명</th><th>수량</th><th>단위</th><th></th></tr></thead><tbody>` +
      list.map((c, i) => `<tr data-i="${i}"><td class="c1">${i + 1}</td><td><textarea class="in" data-f="n" rows="${Math.max(1, (c.n.match(/\n/g) || []).length + 1)}" placeholder="구성품 이름 (줄바꿈 가능)">${esc(c.n)}</textarea></td>
        <td class="c3"><input class="in sm" data-f="q" value="${esc(c.q)}"></td><td class="c4"><input class="in sm" data-f="u" value="${esc(c.u)}" placeholder="EA"></td>
        <td class="ops"><button class="mini" data-op="up" title="위로">↑</button><button class="mini" data-op="down" title="아래로">↓</button><button class="mini del" data-op="del" title="삭제">✕</button></td></tr>`).join('') +
      `</tbody></table><div class="edfoot"><button class="btn sm" data-op="add">+ 행 추가</button><span class="sp"></span><button class="btn sm ghost" data-op="cancel">취소</button><button class="btn sm dark" data-op="save">저장</button></div>`;
  }

  /* ---------- 수리·부품 교체 이력 ---------- */
  function who(role, name) {
    if (!name) return '<span class="muted">—</span>';
    const img = cat.stampOf(role, name);
    return img ? `<img class="stamp" src="${img}" alt="${esc(role + ' ' + name)}" title="${esc(name)}">` : `<span class="noname" title="직인 미등록">${esc(name)}</span>`;
  }
  function histView(r) {
    const H = cat.histOf(r.key);
    let h = `<div class="sech"><h4>수리 또는 부품 교체 이력<span class="cnt">${H.length}건</span></h4><span class="sp"></span>
      <button class="btn sm" data-ed="hist-add">+ 이력 추가</button>${H.length ? '<button class="btn sm" data-ed="hist">✎ 편집</button>' : ''}</div>`;
    if (!H.length) return h + '<p class="comp-empty">등록된 이력이 없습니다. [+ 이력 추가]로 수리·부품 교체 내용을 적으면 Word 뒷면에 담당자·팀장 직인과 함께 들어갑니다.</p>';
    h += '<table class="comp htab"><thead><tr><th>일자</th><th>내용</th><th style="text-align:center">담당자</th><th style="text-align:center">팀장</th></tr></thead><tbody>' +
      H.map(x => `<tr><td class="c1 nowrap">${esc(F.date(x.d) || x.d)}</td><td>${esc(x.c)}</td><td class="st">${who('담당자', x.m)}</td><td class="st">${who('팀장', x.l)}</td></tr>`).join('') + '</tbody></table>';
    if (H.length > PER) h += `<p class="comp-empty">Word 뒷면 한 쪽에 ${PER}건까지 들어가며, 넘으면 뒷면이 한 쪽 더 생깁니다.</p>`;
    return h;
  }
  function options(role, cur) {
    const ps = cat.people().filter(p => p.role === role);
    const names = ps.map(p => p.name); if (cur && !names.includes(cur)) names.push(cur);
    return `<option value="">(없음)</option>` + names.map(n => `<option ${n === cur ? 'selected' : ''}>${esc(n)}</option>`).join('');
  }
  function histEdit(list) {
    const none = !cat.people().length;
    return `<div class="sech"><h4>수리·부품 교체 이력 편집</h4></div>
      ${none ? '<p class="comp-empty warnbox">등록된 담당자·팀장이 없습니다. 위쪽 [직인 관리]에서 먼저 등록하면 직인이 들어갑니다. (이름 없이 저장해도 됩니다)</p>' : ''}
      <table class="comp edit htab"><thead><tr><th>일자</th><th>내용</th><th>담당자</th><th>팀장</th><th></th></tr></thead><tbody>` +
      list.map((x, i) => `<tr data-i="${i}"><td><input type="date" class="in" data-f="d" value="${esc(/^\d{4}-\d{2}-\d{2}$/.test(x.d) ? x.d : '')}"></td>
        <td><textarea class="in" data-f="c" rows="2" placeholder="예) 램프 교체(D2), 정기 교정">${esc(x.c)}</textarea></td>
        <td><select class="in" data-f="m">${options('담당자', x.m)}</select></td><td><select class="in" data-f="l">${options('팀장', x.l)}</select></td>
        <td class="ops"><button class="mini del" data-op="del" title="삭제">✕</button></td></tr>`).join('') +
      `</tbody></table><div class="edfoot"><button class="btn sm" data-op="add">+ 줄 추가</button><button class="btn sm ghost" data-op="people">직인 관리</button><span class="sp"></span><button class="btn sm ghost" data-op="cancel">취소</button><button class="btn sm dark" data-op="save">저장</button></div>`;
  }
  const newHist = () => ({ d: today(), c: '', m: (cat.currentOf('담당자') || {}).name || '', l: (cat.currentOf('팀장') || {}).name || '' });

  /** 상세 화면의 두 칸(#secComp, #secHist)을 그리고 이벤트 연결 */
  function mount(r) {
    const cBox = document.getElementById('secComp'), hBox = document.getElementById('secHist');
    let cDraft = null, hDraft = null;
    const read = (box, draft) => box.querySelectorAll('tbody tr[data-i]').forEach(tr => {
      const o = draft[+tr.dataset.i]; tr.querySelectorAll('[data-f]').forEach(inp => { o[inp.dataset.f] = inp.value.split('\n').map(x => x.trim()).filter(Boolean).join('\n'); });
    });
    const drawC = () => { cBox.innerHTML = cDraft ? compEdit(cDraft) : compView(r); };
    const drawH = () => { hBox.innerHTML = hDraft ? histEdit(hDraft) : histView(r); };
    cBox.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.ed === 'comp') { cDraft = cat.compsOf(r.key).map(c => ({ ...c })); if (!cDraft.length) cDraft.push({ n: '', q: '1', u: 'EA' }); drawC(); cBox.querySelector('textarea').focus(); return; }
      if (!cDraft) return;
      read(cBox, cDraft);
      const i = +(b.closest('tr') || {}).dataset?.i;
      switch (b.dataset.op) {
        case 'add': cDraft.push({ n: '', q: '1', u: 'EA' }); drawC(); cBox.querySelectorAll('textarea[data-f="n"]')[cDraft.length - 1].focus(); break;
        case 'del': cDraft.splice(i, 1); drawC(); break;
        case 'up': if (i > 0) [cDraft[i - 1], cDraft[i]] = [cDraft[i], cDraft[i - 1]]; drawC(); break;
        case 'down': if (i < cDraft.length - 1) [cDraft[i + 1], cDraft[i]] = [cDraft[i], cDraft[i + 1]]; drawC(); break;
        case 'cancel': cDraft = null; drawC(); break;
        case 'save': cat.setComps(r.key, cDraft.filter(c => c.n)); cDraft = null; drawC(); cat.toast('장비구성내역을 저장했습니다 (내보내기 전까지 이 브라우저에 임시 저장).'); break;
      }
    };
    hBox.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.ed === 'hist' || b.dataset.ed === 'hist-add') {
        hDraft = cat.histOf(r.key).map(x => ({ ...x }));
        if (b.dataset.ed === 'hist-add' || !hDraft.length) hDraft.push(newHist());
        drawH(); const ta = hBox.querySelectorAll('textarea'); if (ta.length) ta[ta.length - 1].focus(); return;
      }
      if (!hDraft) return;
      read(hBox, hDraft);
      const i = +(b.closest('tr') || {}).dataset?.i;
      switch (b.dataset.op) {
        case 'add': hDraft.push(newHist()); drawH(); break;
        case 'del': hDraft.splice(i, 1); drawH(); break;
        case 'people': cat.peopleUI.open(() => drawH()); break;
        case 'cancel': hDraft = null; drawH(); break;
        case 'save': {
          const list = hDraft.filter(x => x.d || x.c).sort((a, b) => (a.d || '9999').localeCompare(b.d || '9999'));
          cat.setHist(r.key, list); hDraft = null; drawH(); cat.toast('수리 이력을 저장했습니다 (내보내기 전까지 이 브라우저에 임시 저장).'); break;
        }
      }
    };
    drawC(); drawH();
    return { busy: () => !!(cDraft || hDraft) };
  }
  cat.editors = { mount };
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/50_filter_panel.js ==== */
/* [부품 C5] 상세 검색 창 — 금액(분포 막대 + 양쪽 슬라이더 + 만원 단위 직접 입력 + 빠른 범위),
 *  단가/총액 기준, 도입연도, 제조국, 구분(시트), 사진·구성내역 있는 장비만
 *  창 안에서 바꾼 값은 '임시(T)'에 두고 [장비 N개 보기]를 눌러야 적용된다. */
(function (EQ) {
  'use strict';
  const cat = EQ.cat, { S, R } = cat, { esc } = EQ.util, F = EQ.fmt;
  const $ = id => document.getElementById(id);
  const MAN = 10000;
  // 슬라이더는 로그 눈금(1만원~최대)으로 — 금액 범위가 수십만~수억이라 선형이면 쓸 수 없음
  const prices = R.map(r => r.price).filter(p => p > 0);
  const LO = MAN, HI = Math.max(MAN * 10, ...prices) * 1.0001, STEPS = 200;
  const toPos = v => v == null ? null : Math.round(Math.log(Math.max(v, LO) / LO) / Math.log(HI / LO) * STEPS);
  const toVal = p => Math.round(LO * Math.pow(HI / LO, p / STEPS) / MAN) * MAN;
  let T = null;   // 임시 상태

  function snapshot() { return { pmin: S.pmin, pmax: S.pmax, basis: S.basis, yMin: S.yMin, yMax: S.yMax, countries: new Set(S.countries), sheets: new Set(S.sheets), photo: S.photo, comps: S.comps }; }
  function countWith(t) {
    const keep = { ...snapshot(), bucket: S.bucket }; Object.assign(S, t, { bucket: t.pmin != null || t.pmax != null ? null : S.bucket });
    const n = R.filter(r => cat.match(r)).length; Object.assign(S, keep); return n;
  }

  function histogram() {
    const bins = new Array(30).fill(0);
    R.forEach(r => { const p = T.basis === 'total' ? r._total : r.price; if (p > 0) bins[Math.min(29, Math.floor(toPos(p) / STEPS * 30))]++; });
    const mx = Math.max(1, ...bins), a = toPos(T.pmin) ?? 0, b = toPos(T.pmax) ?? STEPS;
    return bins.map((n, i) => { const mid = (i + 0.5) / 30 * STEPS; return `<i class="${mid >= a && mid <= b ? 'on' : ''}" style="height:${n ? 8 + n / mx * 92 : 0}%" title="${n}대"></i>`; }).join('');
  }

  function body() {
    const countries = [...new Set(R.filter(r => r.sheet === S.cat).map(r => r.country || '(미상)'))].sort((a, b) => a.localeCompare(b, 'ko'));
    const [y0, y1] = S.yearRange, yrs = []; for (let y = y1; y >= y0 && y0; y--) yrs.push(y);
    const opt = (v, cur) => `<option value="${v}" ${cur == v ? 'selected' : ''}>${v}년</option>`;
    const quick = [[0, 100], [100, 500], [500, 1000], [1000, 3000], [3000, 5000], [5000, 10000], [10000, null]];
    return `
    <div class="fsec"><h5>금액 범위</h5><p class="d">막대는 금액대별 장비 수입니다. 슬라이더를 끌거나 만원 단위로 직접 입력하세요.</p>

      <label class="togglerow"><span><b>장비구성내역 있는 장비만</b><small>구성 등록 ${R.filter(r => r.sheet === S.cat && r.comps && r.comps.length).length}대</small></span><span class="switch"><input type="checkbox" id="tComps" ${T.comps ? 'checked' : ''}><span></span></span></label></div>`;
  }

  function refresh(rebuild) {
    if (rebuild) { $('filterBody').innerHTML = body(); wire(); }
    else $('fHist').innerHTML = histogram();
    const a = +$('rLo').value, b = +$('rHi').value;
    $('fFill').style.left = (a / STEPS * 100) + '%'; $('fFill').style.right = (100 - b / STEPS * 100) + '%';
    const n = countWith(T);
    $('fApply').textContent = `장비 ${n}개 보기`;
    $('mHint').textContent = T.pmin != null || T.pmax != null ? `적용 범위: ${T.pmin != null ? F.won(T.pmin) + '원' : '처음'} ~ ${T.pmax != null ? F.won(T.pmax) + '원' : '끝'}` : '';
  }
  function wire() {
    const body = $('filterBody');
    const fromSlider = () => {
      let a = +$('rLo').value, b = +$('rHi').value; if (a > b) [a, b] = [b, a];
      T.pmin = a <= 0 ? null : toVal(a); T.pmax = b >= STEPS ? null : toVal(b);
      $('mLo').value = T.pmin != null ? T.pmin / MAN : ''; $('mHi').value = T.pmax != null ? T.pmax / MAN : ''; refresh();
    };
    $('rLo').oninput = fromSlider; $('rHi').oninput = fromSlider;
    const fromInput = () => {
      const a = $('mLo').value === '' ? null : Math.max(0, +$('mLo').value) * MAN, b = $('mHi').value === '' ? null : Math.max(0, +$('mHi').value) * MAN;
      T.pmin = a; T.pmax = b;
      $('rLo').value = toPos(a) ?? 0; $('rHi').value = toPos(b) ?? STEPS; refresh();
    };
    $('mLo').oninput = fromInput; $('mHi').oninput = fromInput;
    $('yLo').onchange = () => { T.yMin = $('yLo').value ? +$('yLo').value : null; refresh(); };
    $('yHi').onchange = () => { T.yMax = $('yHi').value ? +$('yHi').value : null; refresh(); };
    $('tPhoto').onchange = e => { T.photo = e.target.checked; refresh(); };
    $('tComps').onchange = e => { T.comps = e.target.checked; refresh(); };
    body.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.basis) { T.basis = b.dataset.basis; refresh(true); }
      else if (b.dataset.q != null) { const [x, y] = b.dataset.q.split(','); $('mLo').value = x === '0' ? '' : x; $('mHi').value = y; fromInput(); }

    };
  }
  function open() {
    T = snapshot(); refresh(true);

  }
  function close() { $('filters').classList.remove('show'); $('filters').setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
  $('fApply').onclick = () => { Object.assign(S, T); if (S.pmin != null || S.pmax != null) S.bucket = null; close(); cat.apply(); };
  $('fClear').onclick = () => { T = { pmin: null, pmax: null, basis: 'unit', yMin: null, yMax: null, countries: new Set(), sheets: new Set(), photo: false, comps: false }; refresh(true); };

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('filters').classList.contains('show')) close(); });
  cat.filterPanel = { open, close };
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/60_sheets.js ==== */
/* [부품 C6] 엑셀 원본 보기 — 카탈로그에 함께 저장된 원본 엑셀의 모든 시트를 표로 보여줌
 *  시트 탭, 찾기(일치 행 강조), 줄바꿈 켜기/끄기, 관리번호 칸 클릭 → 장비 상세 */
(function (EQ) {
  'use strict';
  const cat = EQ.cat, { D } = cat, { esc } = EQ.util;
  const $ = id => document.getElementById(id);
  const SV = D.sheetsView || [];
  let cur = 0, focusRow = null;
  const ledgerSet = new Set(cat.R.map(r => r.sheet));

  function renderTabs() {
    $('sheetTabs').innerHTML = SV.map((s, i) => `<button class="chip" data-si="${i}" aria-pressed="${i === cur}">${esc(s.name)}<span class="c">${s.rows.length}</span></button>`).join('');
  }
  function render() {
    renderTabs();
    const s = SV[cur];
    if (!s) { $('sheetTable').innerHTML = '<div class="empty"><b>원본 엑셀 내용이 없습니다</b></div>'; return; }
    const q = cat.norm($('sheetQ').value), linkable = ledgerSet.has(s.name) && s.idCol >= 0;
    let hits = 0;
    const body = s.rows.map(row => {
      const [no, ...cells] = row;
      const hit = q && cells.some(c => cat.norm(c).includes(q)); if (hit) hits++;
      const cls = (no === focusRow ? 'focus ' : '') + (hit ? 'hit' : '');
      return `<tr class="${cls}" data-row="${no}"><td class="rn">${no}</td>` + cells.map((c, i) => {
        const t = q ? cat.hl(c, [q]) : esc(c);
        return linkable && i === s.idCol && c ? `<td class="link" data-uid="${esc(s.name + '#' + no)}" title="장비 상세 보기">${t}</td>` : `<td title="${c.length > 40 ? esc(c) : ''}">${t}</td>`;
      }).join('') + '</tr>';
    }).join('');
    $('sheetTable').innerHTML = `<table class="x ${$('sheetWrap').checked ? 'wrap' : 'nowrap'}"><thead><tr><th class="rn">행</th>${s.header.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
    $('sheetMeta').textContent = `‘${s.name}’ 시트 · ${s.rows.length}행 × ${s.header.length}열` + (q ? ` · 찾은 행 ${hits}개` : '') + (linkable ? ' · 관리번호를 누르면 장비 상세가 열립니다' : '');
    if (focusRow) { const tr = $('sheetTable').querySelector(`tr[data-row="${focusRow}"]`); if (tr) tr.scrollIntoView({ block: 'center' }); }
  }
  /** 시트 이름과 엑셀 행 번호로 바로 이동 */
  function show(name, row) {
    const i = SV.findIndex(s => s.name === name); cur = i < 0 ? 0 : i; focusRow = row || null;
    cat.setTab('sheet'); render();
  }
  $('sheetTabs').onclick = e => { const b = e.target.closest('[data-si]'); if (b) { cur = +b.dataset.si; focusRow = null; render(); } };
  $('sheetQ').oninput = () => { focusRow = null; render(); };
  $('sheetWrap').onchange = render;
  $('sheetDl').onclick = () => cat.actions.original();
  $('sheetTable').onclick = e => { const td = e.target.closest('[data-uid]'); if (td) { cat.setTab('browse'); cat.detail.openByUid(td.dataset.uid); } };
  $('nSheets').textContent = SV.length ? SV.length + '시트' : '';
  cat.sheets = { render, show };
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/70_actions.js ==== */
/* [부품 C7] 보내기·내보내기 — 원본 엑셀(내장) 내려받기·공유·메일, 필터 결과 xlsx, Word 장비관리대장, 인쇄
 *  Word 는 카탈로그 안의 양식(ledger.docx)·사진으로 생성기와 같은 부품(EQ.DocBuilder)을 써서 만든다. */
(function (EQ) {
  'use strict';
  const cat = EQ.cat, { D, S } = cat, U = EQ.util, F = EQ.fmt;
  const CFG = EQ.CONFIG;
  const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const srcName = (D.source && D.source.name) || '장비관리대장.xlsx';

  function originalBlob() {
    if (!D.source || !D.source.b64) return null;
    return new Blob([U.b64ToBytes(D.source.b64)], { type: XLSX_MIME });
  }
  function original() {
    const b = originalBlob(); if (!b) { cat.toast('카탈로그에 원본 엑셀이 들어 있지 않습니다.'); return; }
    U.download(b, srcName); cat.toast(`${srcName} 내려받기`);
  }
  async function share() {
    const b = originalBlob(); if (!b) { cat.toast('원본 엑셀이 없습니다.'); return; }
    const file = new File([b], srcName, { type: XLSX_MIME });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: srcName, text: `시험장비 관리대장 (${D.records.length}대)` }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    cat.toast('이 브라우저는 파일 공유를 지원하지 않아 내려받기로 대신합니다.');
    original();
  }
  function mail() {
    original();
    const subj = encodeURIComponent(`[장비관리대장] ${srcName.replace(/\.xlsx?$/i, '')}`);
    const body = encodeURIComponent(`안녕하세요.\n시험장비 관리대장(장비 ${D.records.length}대)을 보내드립니다.\n\n※ 방금 내려받은 '${srcName}' 파일을 이 메일에 첨부해 주세요.\n`);
    setTimeout(() => { location.href = `mailto:?subject=${subj}&body=${body}`; }, 600);
  }

  async function filteredXlsx() {
    const L = S.list; if (!L.length) { cat.toast('보이는 장비가 없습니다.'); return; }
    const head = ['구분', '순번', '관리번호', '구입일련번호', '물품번호', '물품명', '물품명(외부 보고용)', '규격', '제조사', '제조국', '도입일', '수량', '도입가격(원)', '총액(원)', '사용 상태', '입고시 상태', '용도', '장소', '비고', '도입 회사명', '도입처 주소', '연락처', '주요 성능 및 특징', '구성 수'];
    const rows = [head, ...L.map(r => [r.sheet, r.seq, r.id, r.serial, r.item, r.name, r.nameExt, r.spec, r.maker, r.country, F.date(r.date, 'dash'), r.qty, r.price, r._total, r.status, r.cond, r.usage, r.place, r.remark, r.vendor, r.addr, r.tel, r.note, (r.comps || []).length])];
    const comp = [['관리번호', '물품명', '연번', '내용', '수량', '단위']];
    L.forEach(r => (r.comps || []).forEach((c, i) => comp.push([r.id, r.name, i + 1, c.n, c.q, c.u])));
    const blob = await EQ.xlsxWrite([
      { name: '장비목록', rows, widths: [8, 6, 13, 18, 18, 26, 22, 24, 18, 9, 11, 6, 14, 14, 9, 9, 22, 14, 18, 20, 30, 15, 50, 7] },
      { name: '장비구성', rows: comp, widths: [13, 26, 6, 40, 7, 7] },
      { name: '수리이력', rows: [['관리번호', '물품명', '연번', '일자', '내용', '담당자', '팀장'], ...L.flatMap(r => (r.hist || []).map((h, i) => [r.id, r.name, i + 1, h.d, h.c, h.m, h.l]))], widths: [13, 26, 6, 12, 50, 10, 10] },

  }

  /** dataURL 사진 → {bytes, ext, w, h, key} */
  async function photoOf(r) {
    const url = cat.image(r.ph); if (!url) return null;
    const m = /^data:image\/(\w+);base64,(.*)$/.exec(url); if (!m) return null;
    const bytes = U.b64ToBytes(m[2]);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    return { bytes, ext: m[1] === 'png' ? 'png' : 'jpg', w: img.naturalWidth, h: img.naturalHeight, key: r.ph };
  }
  async function wordFor(list, name) {
    if (!D.template) { cat.toast('카탈로그에 Word 양식이 없습니다.'); return; }
    if (!list.length) { cat.toast('보이는 장비가 없습니다.'); return; }

      for (const r of list) { b.append(r, await photoOf(r)); }
      const blob = await b.finish();

    } catch (e) { console.error(e); cat.toast('Word 만들기 실패: ' + (e.message || e)); }
  }
  /* ---------- 편집 내용 확정: 통합 엑셀 / 관리대장 파일 ---------- */
  const CHUNK = 30000;   // 엑셀 한 칸 글자 한도(32,767) 아래로 나눠 담기
  function editSheets() {
    const compM = cat.mergedComps(), histM = cat.mergedHist(), people = cat.people();
    const idOf = {}; cat.R.forEach(r => { idOf[r.key] = idOf[r.key] || r.id; });
    (D.compIds || []).forEach(([k, id]) => { idOf[k] = idOf[k] || id; });
    (D.histIds || []).forEach(([k, id]) => { idOf[k] = idOf[k] || id; });
    const nameOf = {}; cat.R.forEach(r => { nameOf[r.key] = nameOf[r.key] || r.name; });
    const compRows = []; Object.entries(compM).forEach(([k, list]) => list.forEach((c, i) => compRows.push([idOf[k] || k, i + 1, c.n, /^\d+(\.\d+)?$/.test(c.q) ? +c.q : c.q, c.u])));
    const histRows = []; Object.entries(histM).forEach(([k, list]) => list.forEach((h, i) => histRows.push([idOf[k] || k, nameOf[k] || '', i + 1, h.d, h.c, h.m, h.l])));
    const nChunk = Math.max(1, ...people.map(p => Math.ceil((p.img || '').length / CHUNK)));
    const pRows = people.map(p => { const r = [p.role, p.name, p.start, p.note]; for (let i = 0; i < nChunk; i++) r.push((p.img || '').slice(i * CHUNK, (i + 1) * CHUNK)); return r; });
    const H = CFG.sheets;
    return [
      { name: D.compSheet || '장비구성', header: ['관리번호', '연번', '내용', '수량', '단위'], rows: compRows, widths: [18, 8, 60, 10, 9] },
      { name: H.historySheet, header: ['관리번호', '물품명', '연번', '일자', '내용', '담당자', '팀장'], rows: histRows, widths: [14, 28, 6, 12, 60, 10, 10] },

  async function integratedBlob() {

  async function integrated() {
    try { const b = await integratedBlob(), n = datedName(); U.download(b, n); cat.toast(`${n} — 장비구성·수리이력·직인관리 반영. 다음 생성 때 이 파일을 쓰세요.`); }
