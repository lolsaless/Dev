  }
  /** 편집을 담은 새 관리대장(HTML) — 이 파일과 같은 틀에 새 데이터를 넣어 저장 */
  async function saveHtml() {
    try {
      const blob = await integratedBlob(), bytes = new Uint8Array(await blob.arrayBuffer()), sheets = editSheets();
      const shot = sp => ({ name: sp.name, header: sp.header, idCol: sp.header.indexOf('관리번호'),
        rows: sp.rows.map((r, i) => [i + 2, ...r.map(c => { c = String(c ?? ''); return c.length > 3000 && !/\s/.test(c) ? '(직인 그림 데이터)' : c; })]) });
      const view = (D.sheetsView || []).filter(v => !sheets.some(s => s.name === v.name)).concat(sheets.map(shot));
      const d = new Date(), z = n => String(n).padStart(2, '0');
      const nd = Object.assign({}, D, {
        docId: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        generated: `${d.getFullYear()}.${z(d.getMonth() + 1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`,
        source: { name: datedName(), size: bytes.length, b64: U.bytesToB64(bytes) },
        sheetsView: view, compsAll: cat.mergedComps(), histAll: cat.mergedHist(), people: cat.people(),
        records: D.records.map(r => { const o = {}; Object.keys(r).filter(k => k[0] !== '_').forEach(k => { o[k] = r[k]; }); o.comps = cat.compsOf(r.key); o.hist = cat.histOf(r.key); return o; }),
      });
      const payload = JSON.stringify(nd).replace(/</g, '\\u003c').replace(/[\u2028\u2029]/g, c => '\\u' + c.charCodeAt(0).toString(16));
      const mods = [...document.querySelectorAll('script[data-eq]')].map(s => s.outerHTML).join('\n');
      const html = `<!DOCTYPE html>\n<html lang="ko">\n<head>${document.head.innerHTML}</head>\n<body>${window.EQ_SHELL}\n<script id="eq-data">window.EQ_DATA = ${payload};<\/script>\n${mods}\n</body>\n</html>`;
      const name = `${CFG.title.replace(/\s+/g, '_')}_${U.stamp()}.html`;
      U.download(new Blob([html], { type: 'text/html;charset=utf-8' }), name);
      cat.toast(`${name} 저장 — 고친 내용이 들어 있어 그대로 보내면 됩니다.`);
    } catch (e) { console.error(e); cat.toast('저장 실패: ' + (e.message || e)); }
  }
  function print() {
    if (S.view !== 'table') { S.view = 'table'; cat.syncView(); cat.apply(); }
    setTimeout(() => window.print(), 300);
  }

  const menu = document.getElementById('sendMenu'), btn = document.getElementById('btnSend');
  btn.onclick = e => { e.stopPropagation(); const on = !menu.classList.contains('show'); menu.classList.toggle('show', on); btn.setAttribute('aria-expanded', on); };
  document.addEventListener('click', e => { if (!menu.contains(e.target)) { menu.classList.remove('show'); btn.setAttribute('aria-expanded', false); } });
  menu.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    menu.classList.remove('show');
    ({ share, mail, orig: original, xlsx: filteredXlsx, docx: () => wordFor(S.list), print, integrated, savehtml: saveHtml })[b.dataset.act]();
  };
  if (D.source && D.source.size) document.getElementById('origInfo').textContent = `${srcName} (${U.fmtBytes(D.source.size)}) — 이 카탈로그에 함께 저장됨`;
  cat.actions = { original, share, mail, filteredXlsx, wordFor, print, integrated, saveHtml, editSheets };
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/80_people.js ==== */
/* [부품 C8] 담당자·팀장 직인 관리 — 사람 등록(이름·사용 시작일), 직인/사인 그림 올리기 또는 직접 서명, 교체·삭제
 *  사람이 바뀌면 '새 사람'을 등록한다 → 지난 이력은 원래 사람의 직인을 그대로 쓰고, 새 이력의 기본값은 '현재' 사람.
 *  그림은 흰 배경을 투명하게 바꾸고(선택) 여백을 잘라 긴 변 300px PNG 로 저장 → 통합 엑셀 '직인관리' 시트에 들어간다. */
(function (EQ) {
  'use strict';
  const cat = EQ.cat, { esc } = EQ.util, F = EQ.fmt, CFG = EQ.CONFIG;
  const $ = id => document.getElementById(id);
  const today = () => new Date().toISOString().slice(0, 10);
  let afterClose = null, sigTarget = null;

  /** 그림(이미지/캔버스) → 정리된 PNG dataURL */
  function cleanStamp(src, w, h, removeWhite) {
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d'); g.drawImage(src, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h), px = d.data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, lum = (px[i] + px[i + 1] + px[i + 2]) / 3;
      if (removeWhite && lum > 225 && Math.max(px[i], px[i + 1], px[i + 2]) - Math.min(px[i], px[i + 1], px[i + 2]) < 30) px[i + 3] = 0;
      else if (removeWhite && lum > 190) px[i + 3] = Math.round(px[i + 3] * (225 - lum) / 35);
      if (px[i + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    g.putImageData(d, 0, 0);
    if (x1 < 0) return null;
    const pad = 4; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
    const cw = x1 - x0 + 1, ch = y1 - y0 + 1, sc = Math.min(1, 300 / Math.max(cw, ch));
    const out = document.createElement('canvas'); out.width = Math.round(cw * sc); out.height = Math.round(ch * sc);
    const og = out.getContext('2d'); og.imageSmoothingQuality = 'high'; og.drawImage(cv, x0, y0, cw, ch, 0, 0, out.width, out.height);
    return out.toDataURL('image/png');
  }
  async function fromFile(file, removeWhite) {
    const bm = await createImageBitmap(file);
    const sc = Math.min(1, 1200 / Math.max(bm.width, bm.height));
    return cleanStamp(bm, Math.round(bm.width * sc), Math.round(bm.height * sc), removeWhite);
  }

  const usedCount = (role, name) => Object.values(cat.mergedHist()).reduce((n, list) => n + list.filter(h => (role === '담당자' ? h.m : h.l) === name).length, 0);

  function body() {
    const P = cat.people();
    const card = (p, i) => {
      const cur = cat.currentOf(p.role) === p, used = usedCount(p.role, p.name);
      return `<div class="pcard" data-i="${i}">
        <div class="pst">${p.img ? `<img src="${p.img}" alt="">` : '<span>직인 없음</span>'}</div>
        <div class="pinfo"><b>${esc(p.name)}</b>${cur ? '<span class="pill-cur">현재</span>' : ''}<small>사용 시작 ${esc(F.date(p.start) || '-')} · 이력 ${used}건</small>${p.note ? `<small>${esc(p.note)}</small>` : ''}</div>
        <div class="pops"><button class="btn sm" data-op="up">직인 올리기</button><button class="btn sm" data-op="sign">서명 그리기</button><button class="btn sm ghost" data-op="edit">수정</button><button class="btn sm ghost" data-op="del">삭제</button></div></div>`;
    };
    return `<p class="d">담당자나 팀장이 바뀌면 <b>새 사람을 등록</b>하세요. 지난 이력에는 원래 사람의 직인이 그대로 남고, 새로 적는 이력에는 사용 시작일이 가장 최근인 <b>현재</b> 사람이 기본으로 들어갑니다.</p>
      ${CFG.roles.map(role => `<div class="fsec"><h5>${role}</h5><div class="plist">${P.map((p, i) => [p, i]).filter(([p]) => p.role === role).map(([p, i]) => card(p, i)).join('') || '<p class="d">등록된 사람이 없습니다.</p>'}</div></div>`).join('')}
      <div class="fsec"><h5>새 사람 등록</h5>
        <div class="pform">
          <label class="mfield"><label>구분</label><div><select id="pRole">${CFG.roles.map(r => `<option>${r}</option>`).join('')}</select></div></label>
          <label class="mfield"><label>성명</label><div><input id="pName" placeholder="홍길동"></div></label>
          <label class="mfield"><label>사용 시작일</label><div><input id="pStart" type="date" value="${today()}"></div></label>
          <label class="mfield"><label>비고(선택)</label><div><input id="pNote" placeholder="예: 2026년 인사이동"></div></label>
        </div>
        <div class="row2"><label class="btn sm">직인·사인 그림 고르기<input type="file" id="pFile" accept="image/*" hidden></label><button class="btn sm" id="pSignNew">서명 그리기</button>
          <label class="ck"><input type="checkbox" id="pWhite" checked> 흰 배경 지우기</label><span class="pprev" id="pPrev"></span><span class="sp"></span><button class="btn sm dark" id="pAdd">등록</button></div>
      </div>
      <div class="sigpad" id="sigPad" hidden><p class="d">아래 칸에 마우스나 펜으로 서명하세요.</p><canvas id="sigCv" width="520" height="200"></canvas>
        <div class="row2"><button class="btn sm ghost" id="sigClear">지우기</button><span class="sp"></span><button class="btn sm ghost" id="sigCancel">취소</button><button class="btn sm dark" id="sigOk">이 서명 사용</button></div></div>`;
  }

  let newImg = '';
  function render() {
    $('peopleBody').innerHTML = body(); newImg = '';
    $('pFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; newImg = await fromFile(f, $('pWhite').checked) || ''; $('pPrev').innerHTML = newImg ? `<img src="${newImg}" alt="">` : '그림에서 직인을 찾지 못했습니다'; };
    $('pSignNew').onclick = () => openSig(null);
    $('pAdd').onclick = () => {
      const name = $('pName').value.trim(), role = $('pRole').value;
      if (!name) { cat.toast('성명을 입력하세요.'); return; }
      if (cat.people().some(p => p.role === role && p.name === name)) { cat.toast(`${role} ${name} 은(는) 이미 있습니다. 직인만 바꾸려면 [직인 올리기]를 쓰세요.`); return; }
      cat.setPeople([...cat.people(), { role, name, start: $('pStart').value, note: $('pNote').value.trim(), img: newImg }]);
      cat.toast(`${role} ${name} 등록`); render();
    };
    sigWire();
  }
  /* 서명 그리기 판 */
  function openSig(i) { sigTarget = i; $('sigPad').hidden = false; const c = $('sigCv'), g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); $('sigPad').scrollIntoView({ block: 'center' }); }
  function sigWire() {
    const c = $('sigCv'), g = c.getContext('2d'); let down = false, last = null;
    const pt = e => { const b = c.getBoundingClientRect(); return [(e.clientX - b.left) * c.width / b.width, (e.clientY - b.top) * c.height / b.height]; };
    c.onpointerdown = e => { down = true; last = pt(e); c.setPointerCapture(e.pointerId); };
    c.onpointermove = e => { if (!down) return; const p = pt(e); g.strokeStyle = '#1a1a1a'; g.lineWidth = 4; g.lineCap = g.lineJoin = 'round'; g.beginPath(); g.moveTo(...last); g.lineTo(...p); g.stroke(); last = p; };
    c.onpointerup = () => { down = false; };
    $('sigClear').onclick = () => g.clearRect(0, 0, c.width, c.height);
    $('sigCancel').onclick = () => { $('sigPad').hidden = true; };
    $('sigOk').onclick = () => {
      const img = cleanStamp(c, c.width, c.height, false); if (!img) { cat.toast('서명이 비어 있습니다.'); return; }
      $('sigPad').hidden = true;
      if (sigTarget == null) { newImg = img; $('pPrev').innerHTML = `<img src="${img}" alt="">`; }
      else { const P = cat.people().map(p => ({ ...p })); P[sigTarget].img = img; cat.setPeople(P); render(); cat.toast('서명을 바꿨습니다.'); }
    };
  }
  $('peopleBody').addEventListener('click', async e => {
    const b = e.target.closest('[data-op]'); if (!b) return;
    const i = +b.closest('.pcard').dataset.i, P = cat.people().map(p => ({ ...p })), p = P[i];
    if (b.dataset.op === 'up') {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = async () => { const f = inp.files[0]; if (!f) return; const img = await fromFile(f, $('pWhite').checked); if (!img) { cat.toast('그림에서 직인을 찾지 못했습니다.'); return; } P[i].img = img; cat.setPeople(P); render(); cat.toast(`${p.name} 직인을 바꿨습니다.`); };
      inp.click();
    } else if (b.dataset.op === 'sign') openSig(i);
    else if (b.dataset.op === 'edit') {
      const name = prompt('성명', p.name); if (name == null) return;
      const start = prompt('사용 시작일 (YYYY-MM-DD)', p.start || today()); if (start == null) return;
      const nn = name.trim() || p.name;
      if (nn !== p.name) {                                  // 이름을 바꾸면 그 사람이 쓰인 이력도 함께 바꿈
        const H = cat.mergedHist();
        Object.entries(H).forEach(([k, list]) => { if (list.some(h => (p.role === '담당자' ? h.m : h.l) === p.name)) cat.setHist(k, list.map(h => p.role === '담당자' ? { ...h, m: h.m === p.name ? nn : h.m } : { ...h, l: h.l === p.name ? nn : h.l })); });
      }
      P[i] = { ...p, name: nn, start: F.iso(start) || start }; cat.setPeople(P); render();
    } else if (b.dataset.op === 'del') {
      const n = usedCount(p.role, p.name);
      if (n) { cat.toast(`이력 ${n}건에 쓰인 사람이라 지울 수 없습니다. 직인만 바꾸거나 새 사람을 등록하세요.`); return; }
      if (!confirm(`${p.role} ${p.name} 을(를) 지울까요?`)) return;
      P.splice(i, 1); cat.setPeople(P); render();
    }
  });

  function open(cb) { afterClose = cb || null; render(); $('people').classList.add('show'); $('people').setAttribute('aria-hidden', 'false'); }
  function close() { $('people').classList.remove('show'); $('people').setAttribute('aria-hidden', 'true'); if (afterClose) { const f = afterClose; afterClose = null; f(); } }
  $('people').addEventListener('click', e => { if (e.target === $('people') || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('people').classList.contains('show') && !/INPUT|SELECT/.test(document.activeElement.tagName)) close(); });
  cat.peopleUI = { open, close };
})(window.EQ = window.EQ || {});

</script>
<script data-eq>/* ==== catalog/js/90_main.js ==== */
/* [부품 C9] 카탈로그 연결 — 검색창·칩·탭·보기 전환 등 화면 이벤트를 각 부품에 연결 */
(function (EQ) {
  'use strict';
  const cat = EQ.cat, { S, D } = cat, U = EQ.util;
  const $ = id => document.getElementById(id);

  const TAB_LABEL0 = n => (n === '장비대장' ? '보유 장비' : n);
  // 머리 정보
  $('meta').textContent = `${D.generated} 기준 · ${D.source ? D.source.name : ''}`;
  $('footer').textContent = `${cat.cats.map(c => `${TAB_LABEL0(c)} ${cat.R.filter(r => r.sheet === c).length}대`).join(' · ')} · 사진 ${Object.keys(D.images).length}장 · ${D.generated} 생성 · 원본: ${D.source ? D.source.name : '-'} · 관심 장비 표시는 이 브라우저에만 저장됩니다.`;

  // 탭: 구분(시트)별 + 엑셀 원본
  const TAB_LABEL = n => (n === '장비대장' ? '보유 장비' : n);
  $('catTabs').innerHTML = cat.cats.map(c => `<button class="tab" role="tab" data-cat="${U.esc(c)}" aria-selected="false">${U.esc(TAB_LABEL(c))}<span class="n">${cat.R.filter(r => r.sheet === c).length}</span></button>`).join('');
  cat.setTab = (t, catName) => {
    const b = t === 'browse';
    if (b && catName != null && catName !== S.cat) { S.cat = catName; S.bucket = null; S.pmin = S.pmax = null; S.countries.clear(); cat.apply(); }
    document.querySelectorAll('#catTabs [data-cat]').forEach(x => x.setAttribute('aria-selected', b && x.dataset.cat === S.cat));
    $('tabSheet').setAttribute('aria-selected', !b);
    $('viewBrowse').hidden = !b; $('viewSheet').hidden = b;
    if (!b && !$('sheetTable').innerHTML) cat.sheets.render();
    window.scrollTo(0, 0);
  };
  $('catTabs').onclick = e => { const b = e.target.closest('[data-cat]'); if (b) cat.setTab('browse', b.dataset.cat); };
  $('tabSheet').onclick = () => cat.setTab('sheet');
  cat.setTab('browse', S.cat);

  // 검색 (입력 즉시, 살짝 지연)
  let tm;
  const onSearch = () => { clearTimeout(tm); tm = setTimeout(() => {
    S.ids = cat.tokens($('qId').value); S.names = cat.tokens($('qName').value); S.any = cat.tokens($('qAny').value); cat.apply();
  }, 120); };
  ['qId', 'qName', 'qAny'].forEach(id => $(id).addEventListener('input', onSearch));
  $('orb').onclick = () => {
    if ($('qId').value || $('qName').value || $('qAny').value) { ['qId', 'qName', 'qAny'].forEach(i => { $(i).value = ''; }); onSearch(); }
    else $('qName').focus();
  };
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); cat.setTab('browse', S.cat); $('qName').focus(); }
  });

  // 금액 칩
  $('priceChips').onclick = e => {
    const b = e.target.closest('[data-b]'); if (!b) return;
    const v = b.dataset.b;
    if (v === 'detail') { S.pmin = S.pmax = null; }
    else { S.pmin = S.pmax = null; S.bucket = v === '' ? null : (S.bucket === +v ? null : +v); }
    cat.apply();
  };
  $('btnFilter').onclick = () => cat.filterPanel.open();

  // 적용 조건 지우기
  $('activeF').onclick = e => {
    const k = e.target.closest('[data-clear]'); if (!k) return;
    const c = k.dataset.clear;
    if (c === 'ids') $('qId').value = ''; if (c === 'names') $('qName').value = ''; if (c === 'any') $('qAny').value = '';
    if (c === 'year') S.yMin = S.yMax = null; if (c === 'countries') S.countries.clear(); if (c === 'sheets') S.sheets.clear();
    if (c === 'photo') S.photo = false; if (c === 'comps') S.comps = false; if (c === 'fav') { S.fav = false; $('btnFav').setAttribute('aria-pressed', false); }
    S.ids = cat.tokens($('qId').value); S.names = cat.tokens($('qName').value); S.any = cat.tokens($('qAny').value);
    cat.apply();
  };

  // 정렬·보기
  $('sort').value = S.sort;
  $('sort').onchange = () => { S.sort = $('sort').value; U.store.set('eq-catalog-sort', S.sort); cat.apply(); };
  cat.syncView = () => { $('vGrid').setAttribute('aria-pressed', S.view === 'grid'); $('vTable').setAttribute('aria-pressed', S.view === 'table'); U.store.set('eq-catalog-view', S.view); };
  $('vGrid').onclick = () => { S.view = 'grid'; cat.syncView(); cat.apply(); };
  $('vTable').onclick = () => { S.view = 'table'; cat.syncView(); cat.apply(); };
  cat.syncView();

  // 관심 장비
  $('btnFav').onclick = () => { S.fav = !S.fav; $('btnFav').setAttribute('aria-pressed', S.fav); $('btnFav').classList.toggle('pill', S.fav); cat.apply(); };

  // 결과 클릭 (카드·행·하트·표 머리 정렬)
  $('results').addEventListener('click', e => {
    const h = e.target.closest('[data-fav]');
    if (h) { e.stopPropagation(); cat.toggleFav(S.list[+h.dataset.fav]); return; }
    const th = e.target.closest('th[data-sort]');
    if (th) { S.sort = S.sort === th.dataset.sort && th.dataset.sort.endsWith('D') ? th.dataset.sort.replace(/D$/, 'A') : th.dataset.sort; $('sort').value = S.sort; cat.apply(); return; }
    if (e.target.id === 'emptyReset') { cat.reset(true); ['qId', 'qName', 'qAny'].forEach(i => { $(i).value = ''; }); $('btnFav').setAttribute('aria-pressed', false); cat.apply(); return; }
    const c = e.target.closest('[data-k]'); if (c) cat.detail.open(+c.dataset.k);
  });
  $('results').addEventListener('keydown', e => { if (e.key === 'Enter') { const c = e.target.closest('[data-k]'); if (c) cat.detail.open(+c.dataset.k); } });

  // 편집 알림 띠
  const syncEdit = () => { const n = cat.changeCount(); $('editbar').hidden = !n; $('editN').textContent = n; document.body.classList.toggle('has-edits', !!n); };
  cat.on('edit', () => { syncEdit(); cat.apply(); });
  $('eDiscard').onclick = () => { if (confirm('이 브라우저에 임시 저장된 고친 내용(장비구성·수리이력·직인)을 모두 되돌릴까요?')) { cat.discardEdits(); cat.toast('되돌렸습니다.'); } };
  $('eXlsx').onclick = () => cat.actions.integrated();
  $('eHtml').onclick = () => cat.actions.saveHtml();
  $('btnPeople').onclick = () => cat.peopleUI.open();
  syncEdit();

  cat.apply();
})(window.EQ = window.EQ || {});

</script>
</body>
