<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   [02_화면/11_시계열.html] 시계열 화면
   하는 일 : 시계열 화면의 자리(제목·버튼·그래프·표 칸). 그리는 동작은 40_화면/11_시계열.js
   주요 이름: v-ts, tsChart, tsLegend, simCard(비슷한 경향 — 동작은 40_화면/23_유사경향.js), tbl
   이럴 때 고침: 이 화면에 버튼·칸을 더하거나 문구를 바꿀 때
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
    <section class="view" id="v-ts">
      <div class="card">
        <div class="card-h"><h3 id="tsTitle"></h3><span class="sub" id="tsSub"></span>
          <div class="tools"><button class="iconbtn" data-img="tsChart">그림 저장</button></div></div>
        <div class="legend" id="tsLegend"></div>
        <div class="chart" id="tsChart"></div>
      </div>
      <div class="card" id="simCard">
        <div class="card-h"><h3>비슷한 경향 지점 찾기</h3><span class="sub" id="simSub"></span>
          <div class="tools simtools">
            <label>찾는 범위 <select id="simScope"><option value="sel">선택한 지점</option><option value="all">묶음 전체 지점</option></select></label>
            <label>비교 방식 <select id="simMode"><option value="raw">월별 값</option><option value="anom">계절 제거(같은 달 평균 대비)</option></select></label>
            <label>기준 ρ ≥ <select id="simThr"><option>0.5</option><option>0.6</option><option>0.7</option><option>0.8</option><option>0.9</option></select></label>
            <button class="iconbtn" id="simUndo" hidden>↩ 이전 선택으로</button></div></div>
        <p class="hint" style="padding:0 16px">위쪽 항목·기간에서 월별 값이 <b>함께 오르내리는 지점</b>을 묶습니다(Spearman 순위상관 ρ, 1에 가까울수록 비슷). '이 지점만 보기'를 누르면 그 지점만 선택되어 그래프가 바뀝니다. '계절 제거'는 모든 하천에 공통인 여름·겨울 변화를 빼고 비교합니다.</p>
        <div id="simGroups"></div>
        <div class="simref"><div class="simtools">기준 지점 <select id="simRef"></select> 와(과) 비슷한 지점</div><div id="simList"></div></div>
      </div>
      <div class="card">
        <div class="card-h"><h3>데이터</h3><span class="sub" id="tblSub"></span>
          <div class="tools"><button class="iconbtn" id="tblCopy">표 복사(엑셀 붙여넣기)</button><button class="iconbtn" id="tblCsv">CSV 저장</button></div></div>
        <div class="tablewrap"><table class="dt" id="tbl"></table></div>
        <div class="foot" id="tblFoot"></div>
      </div>
    </section>
